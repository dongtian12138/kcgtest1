<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">冻结扰动下名义抓法与面板选择抓法的真实 Isaac 抬升对比</title>
  <desc id="desc">左图比较有效摩擦零点四五和质量加百分之五组合；右图比较两个型号在冻结十点扰动集上的最坏任务评分。左图柱高为最大抬升，红线为五十毫米要求。</desc>
  <rect width="1280" height="760" fill="#ffffff"/>
  <text x="640" y="36" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#111827">冻结扰动下的公平 Isaac 动态结果</text>
  <rect x="480" y="58" width="18" height="18" rx="2" fill="#2563eb"/>
  <text x="506" y="73" font-family="sans-serif" font-size="16" fill="#1f2937">V4 名义选择</text>
  <rect x="635" y="58" width="18" height="18" rx="2" fill="#ea580c"/>
  <text x="661" y="73" font-family="sans-serif" font-size="16" fill="#1f2937">冻结面板选择</text>

  <rect x="60" y="105" width="570" height="565" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="345" y="134" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#111827">有效 μ=0.45 + 质量/惯量 +5%</text>
  <line x1="110" y1="570" x2="600" y2="570" stroke="#334155" stroke-width="1.5"/>
  <line x1="110" y1="150" x2="110" y2="570" stroke="#334155" stroke-width="1.5"/>
  <g font-family="sans-serif" font-size="13" fill="#475569" text-anchor="end">
    <text x="102" y="575">0</text><text x="102" y="505">10</text><text x="102" y="435">20</text>
    <text x="102" y="365">30</text><text x="102" y="295">40</text><text x="102" y="225">50</text><text x="102" y="155">60</text>
  </g>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="110" y1="500" x2="600" y2="500"/><line x1="110" y1="430" x2="600" y2="430"/>
    <line x1="110" y1="360" x2="600" y2="360"/><line x1="110" y1="290" x2="600" y2="290"/>
    <line x1="110" y1="150" x2="600" y2="150"/>
  </g>
  <line x1="110" y1="220" x2="600" y2="220" stroke="#dc2626" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="595" y="146" text-anchor="end" font-family="sans-serif" font-size="12" fill="#b91c1c">红虚线：50 mm 要求</text>
  <text transform="translate(82 370) rotate(-90)" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">最大抬升 / mm</text>

  <rect x="170" y="182.1" width="65" height="387.9" fill="#2563eb"/>
  <rect x="240" y="189.2" width="65" height="380.8" fill="#ea580c"/>
  <rect x="405" y="556.7" width="65" height="13.3" fill="#2563eb"/>
  <rect x="475" y="184.9" width="65" height="385.1" fill="#ea580c"/>
  <g font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#111827">
    <text x="202.5" y="174">55.421</text><text x="272.5" y="181">54.400</text>
    <text x="437.5" y="548">1.906</text><text x="507.5" y="177">55.007</text>
  </g>
  <g font-family="sans-serif" font-size="15" text-anchor="middle" fill="#1f2937">
    <text x="237" y="597">当前型号</text><text x="472" y="597">TE</text>
  </g>
  <g font-family="sans-serif" font-size="13" text-anchor="middle" fill="#475569">
    <text x="237" y="621">悬空保持：2 s / 2 s</text><text x="237" y="642">滑移：0.756 / 1.469 mm</text>
    <text x="472" y="621">悬空保持：0 s / 2 s</text><text x="472" y="642">滑移：56.895 / 1.375 mm</text>
  </g>

  <rect x="650" y="105" width="570" height="565" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="935" y="134" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#111827">冻结 10 点上的最坏任务评分</text>
  <line x1="700" y1="570" x2="1190" y2="570" stroke="#334155" stroke-width="1.5"/>
  <line x1="700" y1="150" x2="700" y2="570" stroke="#334155" stroke-width="1.5"/>
  <g font-family="sans-serif" font-size="13" fill="#475569" text-anchor="end">
    <text x="692" y="575">0</text><text x="692" y="470">0.25</text><text x="692" y="365">0.50</text>
    <text x="692" y="260">0.75</text><text x="692" y="155">1.00</text>
  </g>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="700" y1="465" x2="1190" y2="465"/><line x1="700" y1="360" x2="1190" y2="360"/>
    <line x1="700" y1="255" x2="1190" y2="255"/><line x1="700" y1="150" x2="1190" y2="150"/>
  </g>
  <text transform="translate(672 370) rotate(-90)" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#334155">min R_task</text>

  <rect x="760" y="150" width="65" height="420" fill="#2563eb"/>
  <rect x="830" y="150" width="65" height="420" fill="#ea580c"/>
  <rect x="995" y="568" width="65" height="2" fill="#2563eb"/>
  <rect x="1065" y="150" width="65" height="420" fill="#ea580c"/>
  <g font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">
    <text x="792.5" y="174">1.00</text><text x="862.5" y="174">1.00</text>
    <text x="1097.5" y="174">1.00</text>
  </g>
  <text x="1027.5" y="558" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#b91c1c">0.00</text>
  <g font-family="sans-serif" font-size="15" text-anchor="middle" fill="#1f2937">
    <text x="827" y="597">当前型号</text><text x="1062" y="597">TE</text>
  </g>
  <g font-family="sans-serif" font-size="13" text-anchor="middle" fill="#475569">
    <text x="827" y="621">V4：10/10；V5：10/10</text><text x="827" y="642">H1：不支持</text>
    <text x="1062" y="621">V4：至少 1 点失败；V5：10/10</text><text x="1062" y="642">H1：支持该有限集合</text>
  </g>

  <text x="640" y="706" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#334155">柱高与标注均来自对应 evaluation.json；每个离散条件一次运行，simulation-only。</text>
  <text x="640" y="730" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#334155">TE 名义抓法在负载组合中第三指迁出完整指腹且未离桌；结果为型号依赖，不是双型号一致优势。</text>
</svg>
