    depth_handoff_rationale: Only the internal encoder handoff target changes from
      7.930 to 7.850 mm. Ended full09 stopped at encoder 7.897523 mm after 0.75 s
      force-balanced low progress; postrun original CAD at raw181920 shows actual
      depth7.846368 mm with all5keys behind mouth, minimum axial margin0.100896 mm
      and sidewall residual -0.108311 um within original2um band. Retain original
      fixed-target0.5s hold, actual finger release, all force/collision/travel limits.
      Earlier release support and complete assembly still require direct physical
      validation. This target is an engineering stage transition, not a manufacturer
      limit.
  contact_estimate_filter_time_constant_s: 0.05
  contact_estimate_filter_rationale: 匹配低速导纳与接触估计带宽：用既有50 ms时间常数的因果一阶低通处理六维接触估计，供导纳和附加试探停止判断；原始估计另行保存，原腕部与单指逐步保护不变。回放多个已结束回合显示高频接触估计弯矩远大于50
