schema_version: carts_candidate_joint_route_v1
joint_route_contract_id: CARTS_PER_ACCEPTED_POLICY_KINEMATIC_11_JOINT_ROUTE_V1
claim_scope: STATIC_KINEMATIC_JOINT_ROUTE_BINDING_ONLY

input_binding:
  candidate_route_method_id: CARTS_HASH_BOUND_PER_ACCEPTED_POLICY_ROUTE_STATE_CONTRACT_V1
  candidate_route_contract_id: CARTS_PER_ACCEPTED_POLICY_HOME_PREGRASP_CLOSURE_LIFT_ROUTE_V1
  aggregate_robot_base_link: world
  target_link: handbase_link
  arm_joint_names:
    - iiwa_joint_1
    - iiwa_joint_2
    - iiwa_joint_3
    - iiwa_joint_4
    - iiwa_joint_5
    - iiwa_joint_6
    - iiwa_joint_7
  hand_joint_names: [f1j1, f1j2, f2j1, f3j2]

solver:
  method: SCIPY_TRF_BOUNDED_POSE_LEAST_SQUARES_V1
  pregrasp_seed_rule: HOME_THEN_UNSCRAMBLED_SOBOL_INTERIOR_JOINT_LIMITS
  pregrasp_sobol_point_count: 8
  sobol_interior_lower_fraction: 0.10
  sobol_interior_upper_fraction: 0.90
  feasible_choice_rule: FIRST_FEASIBLE_IN_FIXED_SEED_ORDER
  orientation_residual_length_scale_m_per_rad: 0.20
  position_tolerance_m: 1.0e-7
  orientation_tolerance_rad: 1.0e-6
  function_tolerance: 1.0e-13
  step_tolerance: 1.0e-13
  gradient_tolerance: 1.0e-13
  maximum_function_evaluations: 2000

route_sampling:
  approach_rule: MINIMUM_JERK_JOINT_INTERPOLATION_HOME_TO_PREGRASP
  approach_maximum_arm_joint_step_rad: 0.02
  closure_rule: FIXED_ARM_WITH_CUMULATIVE_CONTACT_TRIGGERED_HAND_INTERVALS
  lift_rule: WORLD_Z_CARTESIAN_WAYPOINT_IK_WARM_STARTED_FROM_PREVIOUS_WAYPOINT
  lift_translation_world_m: [0.0, 0.0, 0.04]
  lift_cartesian_step_m: 0.005
  lift_waypoint_count: 9
  lift_maximum_arm_joint_step_rad: 0.03

truth_firewall:
  legacy_joint_waypoints_allowed: false
  display_only_proposal_allowed: false
  formal_selected_policy_required_as_input: false
  online_object_ground_truth_allowed: false
  online_contact_ground_truth_allowed: false
  post_start_object_pose_write_allowed: false
  collision_result_claimed: false
  controller_execution_authorized: false
  isaac_dynamic_state_allowed: false
  hardware_state_allowed: false
