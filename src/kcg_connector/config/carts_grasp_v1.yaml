schema_version: carts_grasp_v1
method: CARTS-Grasp
claim_scope: SIMULATION_ONLY_ZERO_OBJECT_TUNING_CROSS_MODEL_STUDY

shared_protocol:
  object_specific_algorithm_tuning_allowed: false
  legacy_candidate_import_allowed: false
  legacy_h_chain_import_allowed: false
  online_object_ground_truth_allowed: false
  online_contact_truth_allowed: false
  hardware_authorized: false

surface_model:
  assembly_axis_source: OBJECT_CONTRACT
  deterministic_surface_sampling: AREA_STRATIFIED_SOBOL
  pad_footprint_source: HAND_CONTACT_MODEL
  functional_surface_mask_source: OBJECT_CONTRACT_PLUS_GENERAL_TOPOLOGY
