    preshape_joint_names: [f1j1]
    prepared_pad_order: [finger_1_pad, finger_2_pad, finger_3_pad]
  lane_order: [DIRECT_V9, SURFACE_PAD_A, SURFACE_PAD_B, SURFACE_PAD_C]
  lanes:
    DIRECT_V9:
      dimension: 5
      sobol_seed: 20260820
      anchor_pad_ordinal: null
      anchor_pad_name: null
      maximum_prefix_design_sha256: 465fe40f4bf0bb4b1e659f67f702a0baefdde17579eeaf442059bc3c0a87f537
    SURFACE_PAD_A:
      dimension: 6
      sobol_seed: 20260821
      anchor_pad_ordinal: 0
      anchor_pad_name: finger_1_pad
      maximum_prefix_design_sha256: f21412d91685e8c116cc9ef195fd7baf4e9f3725ec5566abe9ede805371c0816
    SURFACE_PAD_B:
      dimension: 6
      sobol_seed: 20260822
      anchor_pad_ordinal: 1
      anchor_pad_name: finger_2_pad
      maximum_prefix_design_sha256: e694f5be3a6853508f3495eaed3fcbc6988ae569363b85d9675b216f1ab2579b
    SURFACE_PAD_C:
      dimension: 6
      sobol_seed: 20260823
      anchor_pad_ordinal: 2
      anchor_pad_name: finger_3_pad
      maximum_prefix_design_sha256: aaa5a1ca60ae9448b5ccca3b606085666bc4006d51ff94a6c1c8d18d72252aac
  schedule_rule: ROUND_ROBIN_DIRECT_THEN_PAD_A_THEN_PAD_B_THEN_PAD_C
  allowed_total_attempt_budgets: [128, 256, 512]
  main_total_attempt_budget: 256
  maximum_points_per_lane: 128
  proposal_failure_consumes_attempt: true
  duplicate_consumes_attempt: true
  replacement_sampling_allowed: false
  maximum_v9_evaluations_equals_attempt_budget: true
  deduplication_rule: CANONICAL_V9_FIVE_BIG_ENDIAN_BINARY64_VALUES_EXACT_BYTES_BEFORE_V9
  sobol_design:
    generator: SCIPY_STATS_QMC_SOBOL_VIA_DETERMINISTIC_SOBOL
    scipy_version: 1.8.0
    dependency:
      package: scipy
      version: 1.8.0
      python_manifest_path: src/kcg_connector/setup.py
      python_manifest_sha256: bde1b207d15a35018de4ea91c05bf26d8b143366dcb3eadec4346f2456913765
