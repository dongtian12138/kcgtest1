  output_claim: STATIC_V9_EXACT_CANDIDATE_OR_CONTACT_RANGE_POLICY_ACCEPTANCE_ONLY

contact_range_policy_collision:
  implementation_type_id: kcg_connector.grasp.robust.full_hand_collision.ContactRangePolicyCollisionCertificate
  method_id: CARTS_FULL_HAND_CONTACT_RANGE_POLICY_COLLISION_AGGREGATOR_V1
  independent_two_phase_method_id: CARTS_MP_INTERVAL_INDEPENDENT_TWO_PHASE_SURFACE_PAIR_V1
  phase_domain_rule: COMPLETE_CARTESIAN_PRODUCT_OF_BOTH_REGISTERED_PHASE_INTERVALS
  link_dependency_rule: EVERY_LINK_MUST_DEPEND_ON_AT_MOST_ONE_CLOSURE_SUPPORT
  same_support_rule: SHARED_OR_SINGLE_SUPPORT_PHASE_PATH
  cross_support_rule: INDEPENDENT_SUPPORT_PHASE_PRODUCT
  display_approximation_used_as_formal_evidence: false
  endpoint_or_finite_corner_sampling_allowed: false
  srdf_exemptions_applied: false
  exact_candidate_collision_path_changed: false
  current_state: NOT_CERTIFIABLE
  checkable_scope: HAND_LINK_NONPAD_OBJECT_AND_SELF_PAIR_CONTACT_RANGE_CLOSURE_ONLY
  mandatory_blockers:
    - SOLID_CONTAINMENT_OR_INITIAL_OUTSIDE_CERTIFICATE_UNAVAILABLE
    - AUTHORITATIVE_FULL_HAND_COLLISION_LINK_ROSTER_NOT_PROVEN
    - ARM_ENVIRONMENT_APPROACH_CLOSURE_LIFT_COLLISION_UNAVAILABLE
  claim_limitations:
    - CONTACT_RANGE_POLICY_SEQUENTIAL_CLOSURE_SUPERSET_ONLY
    - EVERY_LINK_MUST_DEPEND_ON_AT_MOST_ONE_CLOSURE_SUPPORT
    - CROSS_SUPPORT_SELF_PAIRS_USE_COMPLETE_TWO_PHASE_PRODUCT
    - MOVING_SURFACE_VS_STATIC_OBJECT_AND_SELF_SURFACE_PAIRS_ONLY
    - NOT_SOLID_CONTAINMENT_OR_INTERIOR_EXCLUSION
    - NOT_CONTINUOUS_PAD_SURFACE_OR_ALLOWED_ENDPOINT_PATCH_CERTIFICATE
    - AUTHORITATIVE_FULL_HAND_COLLISION_LINK_ROSTER_NOT_BOUND
    - NOT_ARM_OR_ENVIRONMENT_APPROACH_CLOSURE_OR_LIFT_COLLISION
    - NO_SRDF_NEVER_OR_ADJACENT_EXEMPTIONS_APPLIED
    - DISPLAY_APPROXIMATION_IS_NOT_READ_AS_FORMAL_EVIDENCE
    - POTENTIAL_CONTACT_TANGENCY_AND_COPLANARITY_REMAIN_UNRESOLVED
  formal_selection_allowed: false
  isaac_launch_allowed: false

post_generation_ranking:
  implementation_type_id: kcg_connector.grasp.robust.post_generation_ranker.PostGenerationRankOnlyPipeline
  method_id: CARTS_POST_GENERATION_COMMON_QMC_LEXICOGRAPHIC_RANKER_V1
  input_type_id: kcg_connector.grasp.robust.top_level_candidate_generator.TopLevelGenerationResult
  output_type_id: kcg_connector.grasp.robust.post_generation_ranker.PostGenerationRankResult
  execution_role: RANK_ONLY_WITHOUT_GENERATION_REFINEMENT_REPLACEMENT_OR_RETRY
  selection: LEXICOGRAPHIC
  selection_order:
    - hard_bound_minimum_task_margin
    - qmc_lower_tail_mean_task_margin
    - minimum_peak_normal_force_n
    - minimum_joint_torque_utilization
    - maximum_trajectory_clearance_m
  tie_break_rule: FIRST_TOP_LEVEL_ATTEMPT_INDEX_THEN_V9_PARAMETER_KEY_HEX
  common_scenarios:
    method_id: CARTS_COMMON_SCRAMBLED_SOBOL_FRICTION_DIAGNOSTIC_V1
    source: SHARED_UNCERTAINTY_PROTOCOL
    identical_realizations_for_every_candidate: true
    candidate_specific_resampling_allowed: false
    scenario_design: SCRAMBLED_SOBOL
    scipy_version: 1.8.0
    dimension: 1
    scenario_count: 128
    sobol_seed: 20260820
    scramble: true
    optimization: null
    identity_encoding: BIG_ENDIAN_BINARY64_ROW_MAJOR
    design_sha256: dd1115f4bd4c52c29fa29261037fe7ef96d79bca10dad6c7a8a066eef3f05631
  failure_retention:
    retain_every_generation_attempt: true
    retain_every_unique_accepted_candidate: true
    retain_every_unique_accepted_policy: true
    retain_every_generation_and_evaluation_failure: true
    failure_reason_or_exception_required: true
    failed_candidate_drop_allowed: false
    collision_invocations_per_unique_accepted_candidate: 1
    wrench_invocations_per_unique_accepted_candidate: 1
    retry_allowed: false
    replacement_after_failure_allowed: false
  formal_selection:
    status: EMPTY_UNTIL_FORMAL_ROOT_INTERVAL_CANDIDATE_PROPAGATION_COMPLETE_COLLISION_AND_CALIBRATED_FULL_UNCERTAINTY
    allowed_with_current_bindings: false
    formal_ranked_keys_must_be_empty: true
    selected_candidate_must_be_none: true
    contact_range_policy_handling: FAIL_CLOSED_BEFORE_COLLISION_OR_WRENCH_UNTIL_POLICY_AWARE_CONSUMERS_EXIST
    contact_range_policy_collision_invocations_before_support: 0
    contact_range_policy_wrench_invocations_before_support: 0
    required_collision_claim_scope: COMPLETE_HAND_OBJECT_ENVIRONMENT_APPROACH_CLOSURE_LIFT_CONTINUOUS_COLLISION_CERTIFIED_LOWER_BOUND
    current_uncertainty_claim_scope: CERTIFIED_SET_CONTAINS_ONLY_DECLARED_FRICTION_INTERVAL_ALL_OTHER_UNCERTAINTIES_REQUIRE_CALIBRATION
    required_additional_uncertainty_binding: MISSING_CALIBRATED_NONFRICTION_UNCERTAINTY_BOUNDS

