  method_id: CARTS_SEQUENTIAL_MP_INTERVAL_FINITE_PAD_WITNESS_CLOSURE_CERTIFIER_V9
  maximum_subdivision_intervals: 4096
  maximum_subdivision_intervals_role: PRE_REGISTERED_COMPUTE_BUDGET_NOT_PHYSICAL_ACCEPTANCE_THRESHOLD
  subdivision_budget_exhaustion_policy: FAIL_CLOSED_REJECT_CANDIDATE_WITH_AUDIT
  budget_convergence_values: [1024, 2048, 4096, 8192]
  budget_convergence_role: COMPUTE_CONVERGENCE_AUDIT_NOT_PHYSICAL_PASS_GATE
  adjacent_budget_result_stability_report_required: true
  physical_acceptance_gate: false
  interval_backend:
    method_id: MPMATH_DIRECTED_INTERVAL_SECOND_ORDER_URDF_JET_V1
    dependency:
      package: mpmath
      version: 1.2.1
      manifest_path: src/kcg_connector/setup.py
      manifest_sha256: bde1b207d15a35018de4ea91c05bf26d8b143366dcb3eadec4346f2456913765
    decimal_precision: 80
    decimal_precision_role: NUMERICAL_INTERVAL_ARITHMETIC_PRECISION_NOT_PHYSICAL_ACCEPTANCE_THRESHOLD
    precision_convergence_values: [50, 80, 120]
    precision_convergence_role: NUMERICAL_PRECISION_CONVERGENCE_AUDIT_NOT_PHYSICAL_PASS_GATE
    maximum_root_bisection_iterations: 256
    maximum_root_bisection_iterations_role: PRE_REGISTERED_COMPUTE_BUDGET_NOT_PHYSICAL_ACCEPTANCE_THRESHOLD
    root_budget_convergence_values: [128, 256, 512]
    root_budget_exhaustion_policy: FAIL_CLOSED_UNRESOLVED
    predicate_policy: STRICT_INTERVAL_SEPARATION_FROM_ZERO_NO_GEOMETRIC_TOLERANCE
    adjacent_precision_result_stability_report_required: true
    physical_acceptance_gate: false
  closure_parameter_domain:
    domain_id: SINGLE_EXCLUSIVE_CLOSURE_JOINT_FULL_OPEN_ENDPOINT_PLUS_NONCLOSURE_PRESHAPE_FULL_URDF_LIMITS_PLUS_PER_PAD_FULL_PATH_LIPSCHITZ_SWEPT_TASK_AABB_OVERLAP_INTERSECTION_PLUS_HALF_OPEN_YAW_AND_CANONICAL_DEGENERATE_AXES_V3
    coordinate_space: UNIT_HYPERCUBE
    dimension: 5
    parameter_layout:
      - assembly_axis_yaw_unit
      - axial_target_unit
      - lateral_task_x_unit
      - lateral_task_y_unit
      - preshape_joint_unit:f1j1
    dimension_and_layout_source: HAND_URDF_JOINT_LIMITS_PLUS_CLOSURE_ACTUATION_CONTRACT
    assembly_axis_yaw:
      coordinate_name: assembly_axis_yaw_unit
      unit_interval: HALF_OPEN_ZERO_TO_ONE
      physical_mapping: TWO_PI_ROTATION_ABOUT_OBJECT_ASSEMBLY_AXIS
      source: OBJECT_CONTRACT_ASSEMBLY_AXIS_AND_TASK_FRAME
    placement:
      coordinate_names: [axial_target_unit, lateral_task_x_unit, lateral_task_y_unit]
      unit_interval: CLOSED_ZERO_TO_ONE
      physical_bounds_source: OBJECT_CONTRACT_PLANNING_GEOMETRY_BOUNDS_INTERSECTED_WITH_FULL_CLOSURE_SWEPT_PAD_AABB
      zero_width_axis_convention: UNIT_COORDINATE_MUST_EQUAL_ZERO
    preshape:
      coordinate_prefix: preshape_joint_unit
      joint_names: [f1j1]
      unit_interval: CLOSED_ZERO_TO_ONE
      joint_selection_source: POSITIVE_SPAN_NONCLOSURE_INDEPENDENT_JOINTS_FROM_HAND_URDF_AND_CLOSURE_ACTUATION_CONTRACT
      physical_bounds_source: FULL_URDF_JOINT_LIMITS

