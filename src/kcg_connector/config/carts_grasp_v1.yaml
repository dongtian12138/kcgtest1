  contact_orientation_feasible_set: DERIVED_FROM_PAD_NORMAL_CONE_JOINT_LIMITS_AND_ASSEMBLY_AXIS
  object_specific_normal_component_thresholds_allowed: false
  analytic_primitive_tessellation:
