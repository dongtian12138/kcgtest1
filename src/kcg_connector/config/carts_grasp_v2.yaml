  transfer_object: te_deutsch_d38999_26fj35pn_step

surface_roles:
  method: TASK_AXIS_OUTER_ENVELOPE_V1
  angular_bin_count: 72
  axial_bin_count: 24
  outer_envelope_depth_m: 0.0015
  minimum_radial_normal_component: 0.60
  maximum_axial_normal_component: 0.65
  radial_numerical_epsilon_m: 1.0e-9

candidate_generation:
  candidate_count: 48
  surface_pool_count: 384
  random_seed: 20260823
  reference_closure_phase: 0.45
  pregrasp_closure_phase: 0.18
  maximum_closure_phase: 0.75
  preshape_joint_positions_rad:
    f1j1: 0.70
  deduplication:
    palm_position_m: 0.002
    palm_orientation_rad: 0.1308996938995747
    anchor_position_m: 0.002
    contact_rms_m: 0.002

closure_prediction:
  closing_order: [finger_1_pad, finger_2_pad, finger_3_pad]
  phase_sample_count: 25
  pad_surface_sample_count: 96
  nearest_face_candidate_count: 16
  contact_distance_m: 0.00075
  initial_clearance_m: 0.0010
  minimum_inward_motion_m_per_phase: 1.0e-5
  motion_derivative_phase_step: 1.0e-4

fast_filter:
  minimum_three_contact_triangle_area_m2: 1.0e-8
  hand_table_state_rule: WORLD_Z_APPROACH_AND_SEQUENTIAL_CONTACT_STOPS
  approach_path_sample_count: 5
  table_penetration_tolerance_m: 1.0e-5
  table_penetration_tolerance_source: NUMERICAL_TOLERANCE
  arm_ik_policy: UNRESOLVED_UNTIL_PUBLIC_LEGACY_FORWARDER
  nonpad_collision_policy: UNRESOLVED_UNTIL_TOP3_LEGACY_EXACT

task_quality:
  scenario_count: 16
  random_seed: 20260823
  lower_tail_fraction: 0.20
  friction_cone_edges: 8
  gravity_acceleration_m_s2: 9.80665
  normal_force_operation_cap_n: 8.0
  task_force_scale: OBJECT_MASS_TIMES_GRAVITY
  task_moment_scale: FORCE_SCALE_TIMES_CHARACTERISTIC_RADIUS
  mass_relative_error: 0.05
  center_of_mass_error_m: 0.001
  gravity_direction_error_rad: 0.03490658503988659
  common_contact_position_error_m: 0.0005
  contact_position_error_m: 0.0005
  contact_normal_error_rad: 0.08726646259971647
  linear_program:
    solver: SCIPY_HIGHS
    constraint_scaling: ROW_AND_COLUMN_INF_NORM
    maximum_iterations: 10000
    primal_feasibility_tolerance: 1.0e-9
    dual_feasibility_tolerance: 1.0e-9
    ipm_optimality_tolerance: 1.0e-10
    physical_acceptance_gate: false

exact_validation:
  top_k: 3
  per_candidate_time_budget_s: 900
  interface_mismatch_policy: UNRESOLVED_FAILS_FORMAL_MAY_ENTER_RESEARCH

ik:
  interval_decimal_precision: 80
  interval_maximum_root_bisection_iterations: 256
  lift_waypoint_count: 11
  solver:
    method: SCIPY_TRF_BOUNDED_POSE_LEAST_SQUARES_V1
    pregrasp_seed_rule: HOME_THEN_UNSCRAMBLED_SOBOL_INTERIOR_JOINT_LIMITS
    pregrasp_sobol_point_count: 8
    sobol_interior_lower_fraction: 0.10
    sobol_interior_upper_fraction: 0.90
    feasible_choice_rule: FIRST_FEASIBLE_IN_FIXED_SEED_ORDER
    orientation_residual_length_scale_m_per_rad: 0.20
    position_tolerance_m: 1.0e-7
    orientation_tolerance_rad: 1.0e-6
    function_tolerance: 1.0e-13
    step_tolerance: 1.0e-13
    gradient_tolerance: 1.0e-13
    maximum_function_evaluations: 2000

dynamic:
  physics_dt_s: 0.008333333333333333
  settle_duration_s: 2.0
  approach_clearance_height_m: 0.10
