# These three profiles are reported separately.  The last profile is an
# adversarial aerospace-style stress budget, not a drawing-specified yaw.
yaw_clearance_profiles:
  nominal_centered:
    slot_width_mm: 1.60
    key_width_mm: 1.32
    radius_mm: 18.855
    derived_peak_to_peak_deg: 0.8509706248885368
    required_p95_strictly_below_deg: 0.4254853124442684
    derivation_kind: centered_nominal_public_dimensions
    drawing_specified_mechanical_yaw_clearance: false
  tight_size_centered:
    slot_width_mm: 1.57
    key_width_mm: 1.35
    radius_mm: 18.925
    derived_peak_to_peak_deg: 0.6661267828482448
    required_p95_strictly_below_deg: 0.3330633914241224
    derivation_kind: centered_tight_size_public_dimensions
    drawing_specified_mechanical_yaw_clearance: false
  adversarial_gdt_stress:
    slot_width_mm: 1.37
    key_width_mm: 1.35
    radius_mm: 18.925
    derivation: subtract_both_full_0_10mm_position_budgets_from_tight_width_gap
    gdt_semantics: positional_pattern_tolerance_not_feature_width
    stress_assumption: both_full_0_10mm_position_budgets_independently_consume_tangential_clearance
    rigid_pattern_shift_note: rigid_shift_moves_window_center_without_reducing_window_width
    derived_peak_to_peak_deg: 0.060550934851961585
    required_p95_strictly_below_deg: 0.030275467425980793
    derivation_kind: project_adversarial_gdt_stress_assumption
    drawing_specified_mechanical_yaw_clearance: false
    measured_hardware_clearance: false
  simulation_acceptance_profile: adversarial_gdt_stress
  selection_basis: project_fail_closed_shadow_stress_policy_not_spec_requirement
  clearance_kind: peak_to_peak_virtual_yaw_window
  source_kind: SPEC_TOLERANCE_DERIVED_CONSERVATIVE_SIMULATION_ONLY
  real_measured_clearance_deg: null

# The public drawings do not specify mass, centre of mass, or inertia.  These
# values freeze the PhysX auto-computed properties of the immutable r4
# collision geometry so checkpoint A does not silently change dynamics.  They
# are simulation assumptions only and are never hardware truth.
simulation_mass_properties:
  source_kind: frozen_r4_physx_autocompute_snapshot_simulation_assumption_not_public_spec
  source_asset_revision: keyed_v2_public_b_rear_r4
  exact_hardware_mass_properties_available: false
  runtime_randomization_enabled_for_checkpoint_a: false
  body_assembly:
    mass_kg: 0.23
    center_of_mass_m: [0.0000027594312541623367, 0.0000015090811302798102, -0.024185307323932648]
    diagonal_inertia_kg_m2: [0.000049906659114640206, 0.00004993189941160381, 0.00005680214235326275]
    # PhysX property-query order is x, y, z, w.
    principal_axes_xyzw: [0.0006416887044906616, -0.0008694019634276628, -0.13318125903606415, 0.9910910725593567]
  coupling_nut:
    mass_kg: 0.08
    center_of_mass_m: [0.0, 0.0, -0.019999999552965164]
    diagonal_inertia_kg_m2: [0.000014186663065629546, 0.000014186664884618949, 0.000023039996449369937]
    principal_axes_xyzw: [0.0, 0.0, 0.0, 1.0]

