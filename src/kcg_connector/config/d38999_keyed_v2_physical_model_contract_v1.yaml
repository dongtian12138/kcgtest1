a0_source_freeze:
  status: FROZEN
  resolved_decisions:
    - name: simulation_scope
      decision: public_spec_deterministic_simulation_only
    - name: connector_asset_identity
      decision: >-
        Preserve r6 and the rejected runtime-cooking r7 artifact unchanged;
        create the corrected v3 r8 identity with frozen millimetre-local
        uniformly scaled convex cooking representation.
    - name: active_robot_description
      decision: >-
        Keep the currently active urdf/iiwa14.xacro mass and inertia values as
        final simulation proxies for this scope; do not substitute either
        alternate local iiwa14 file during A2 through G.
    - name: camera_model
      decision: >-
        Permanently accept the fixed zero-mass Palm/Wrist render cameras as
        simulation sensor proxies; do not claim a real housing or mount.
    - name: wrist_force_model
      decision: >-
        Permanently accept the hand2arm fixed-joint reaction wrench as a
        simulation sensor proxy; freeze its frame, sign, reference point,
        tare, gravity/inertia compensation, and timing before downstream use.
    - name: finger_sensor_model
      decision: >-
        Keep three finger-root joint-effort channels as simulation proxies and
        continue to declare that no fingertip tactile sensor exists.
    - name: fixture_load_path
      decision: >-
        Author an explicit receptacle-to-fixture-to-world fixed load path.
        Infinite fixture stiffness is the final simulation proxy for scope.
    - name: coupling_thread_architecture
      decision: >-
        Use a three-start segmented helical cam-and-follower collision proxy
        plus a physical nut-to-body retaining shoulder.  Entry is gated by
        geometry; no controller truth, runtime engagement switch, pose write,
        magnetic latch, or object actuator is permitted.
    - name: electrical_contact_architecture
      decision: >-
        Author all 61 pins, all 61 hard-face socket entry annuli, and 61
        individually identified compliant contact sleeves.  Compliance is a
        force-transmitting simulation proxy and may not collapse to one global
        axial spring.
    - name: self_collision_policy
      decision: >-
        The successor robot asset enables self-collision.  Its initial filter
        contains exactly the 16 topology-adjacent collision-link pairs listed
        below and none of the sampled reason-Never pairs.  Any additional
        exclusion requires a geometric-overlap review before A5 plus positive
        and negative collision tests.
    - name: solver_authoring_api
      decision: >-
        Freeze the local Isaac schema versions and explicit PhysxSceneAPI,
        PhysxRigidBodyAPI, PhysxCollisionAPI, PhysxMaterialAPI, and
        NewtonArticulationRootAPI attribute names below.  Authored legacy
        PhysX collision offsets intentionally win the current Newton overlay;
        every value requires resolved stage readback in A2 and A3.
    - name: figure3_axial_mapping
      decision: >-
        Keep separate local datum-B depth axes.  The fixed /20 pin receptacle
        uses A, M, N, and the unlettered pin-barrier plane.  The loose /26
        socket plug uses the unlettered L rear control plane together with Y
        and Z; Y and Z are distances back from L and are not direct datum-B
        coordinates.  Unnamed thread and red-band endpoints retain neutral
        Figure-3 control-plane names rather than invented hardware semantics.
    - name: force_transmitting_proxy_parameters
      decision: >-
        Freeze the nominal and bounded A3 calibration values below for
        compliant-contact socket petals, shell spring fingers, elastomer
        seals, and an asymmetric physical anti-decoupling detent.  Every
        spring stiffness and damping is positive, acceleration-spring mode is
        disabled, and no controller callback or hidden engagement state may
        create these forces.
    - name: component_root_and_bottoming_frames
      decision: >-
        Root each connector half at its own datum-B center, keep the two local
        depth axes antiparallel in mating, and treat both chosen metal-stop
        surfaces plus their 15.05 mm full-mate separation as simulation
        proxies rather than public bottoming datums.
    - name: nut_body_bearing_and_load_path
      decision: >-
        Replace the axially locked revolute-only proxy with a D6 cylindrical
        bearing proxy: rotZ is free, transZ has bounded endplay, physical
        shoulders contact before backup joint limits, and body/nut collision
        remains enabled for shoulder and detent forces.
    - name: material_role_partition
      decision: >-
        Every collider receives exactly one kcg:materialRole.  Only the three
        existing terminal collision hulls use the final fingertip grip proxy;
        robot structure, other finger links, nut grip, shell, thread, contacts,
        spring fingers, detent, seal, table, and fixture remain distinct.
  resolved_source_mappings:
    - id: AXIAL_FIGURE3_DATUM_MAP
      status: RESOLVED_FOR_PUBLIC_SPEC_SIMULATION
      boundary: >-
        Public values and endpoint relationships are frozen below.  Where the
        raster figure provides no official endpoint name or one-sided limit,
        r7 uses an explicitly marked simulation proxy and makes no hardware
        fidelity claim.
    - id: CONNECTOR_PROXY_FORCE_PARAMETERS
      status: RESOLVED_AS_BOUNDED_SIMULATION_PROXIES
      boundary: >-
        Nominal values may be calibrated only inside the declared ranges in
        A3.  Leaving a range requires an A0 contract revision before any
        downstream work; A5 freezes the selected values.
  unresolved_source_mappings: []
  a2_asset_authoring_allowed: true

