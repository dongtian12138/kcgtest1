# Model-first contract for the complete deterministic public-spec simulation.
# This document is deliberately fail-closed.  It does not authorize creation
# of the successor asset or any grasp/vision/insertion/twist episode yet.
schema_version: kcg_d38999_keyed_v2_physical_model_contract_v1
status: A0_FROZEN_A2_AUTHORIZED

scope:
  target: deterministic_public_spec_simulation
  guarantee: >-
    Before downstream task work resumes, every geometry or mechanism that can
    guide motion, carry load, create contact, or change the measured wrench is
    implemented as physical collision, a physical joint, or an explicitly
    declared force-transmitting simulation proxy and passes A3 benches.
  manufacturer_cad_claimed: false
  manufactured_unit_fidelity_claimed: false
  hardware_force_curve_claimed: false
  qualification_claimed: false
  future_vendor_cad_or_hardware_recalibration_excluded: true
  downstream_modeling_rework_prevention_boundary: >-
    A5 freezes the public-spec deterministic simulation model.  New vendor CAD,
    measured mass properties, wear, lubrication, or hardware force curves are
    a new scope and cannot be represented as already guaranteed here.

