    - trace_and_thresholds
    - truth_usage_boundary

convex_cooking_representation:
  source_kind: FROZEN_SIMULATION_PROXY
  representation_id: millimetre_local_uniform_scale_convex_v1
  reason: >-
    Isaac Sim 6.0 PhysX 110.1.13 expands metre-local convex meshes thinner
    than 1 mm during GPU-compatible cooking even when minThickness is authored
    as zero.  Millimetre-local points with a uniform 0.001 mesh transform keep
    the world geometry unchanged and preserve the authored convex hull.
  applies_to: every_nonanalytic_connector_mesh_collider
  analytic_cylinder_exception_families: [pins_61, detent_cam_continuous_base_1]
  blueprint_point_unit: meter
  authored_mesh_point_multiplier_from_blueprint: 1000.0
  authored_mesh_local_coordinate_unit: millimetre_numeric
  mesh_xform_op_order: [xformOp:scale]
  mesh_uniform_scale_xyz: [0.001, 0.001, 0.001]
  reset_xform_stack: false
  negative_or_nonuniform_scale_allowed: false
  required_applied_schema: PhysxConvexHullCollisionAPI
  physxConvexHullCollision:minThickness_local_units: 0.001
  effective_world_min_thickness_m: 0.000001
  world_geometry_must_equal_frozen_blueprint: true
  world_bounds_abs_tolerance_m: 0.00000001
  cooked_bounds_abs_tolerance_m: 0.00000001
  cooked_vertex_count_must_equal_authored_convex_hull_vertex_count: true
  adjusted_thickness_warning_count_allowed: 0
  gpu_compatible_collision_required: false
  cpu_collision_fallback_allowed_only_for_oblong_keyway_prisms:
    - /World/D38999Shell25JKeyedPhysicalV3/FixedReceptacle/MatingShell/KeywayShell/TriPrism_0000
    - /World/D38999Shell25JKeyedPhysicalV3/FixedReceptacle/MatingShell/KeywayShell/TriPrism_0001
    - /World/D38999Shell25JKeyedPhysicalV3/FixedReceptacle/MatingShell/KeywayShell/TriPrism_0156
    - /World/D38999Shell25JKeyedPhysicalV3/FixedReceptacle/MatingShell/KeywayShell/TriPrism_0276
    - /World/D38999Shell25JKeyedPhysicalV3/FixedReceptacle/MatingShell/KeywayShell/TriPrism_0380
    - /World/D38999Shell25JKeyedPhysicalV3/FixedReceptacle/MatingShell/KeywayShell/TriPrism_0570
  unexpected_cpu_collision_fallback_count_allowed: 0
  cooked_geometry_gate_required_before_P1: true
  runtime_probe_result: >-
    On the installed Isaac Sim version, a 0.30 mm metre-local box cooked to
    about 1.00 mm and 5 vertices; the millimetre-local scaled equivalent kept
    0.30 mm, 8 vertices, 6 polygons, and a 0.40 mm no-contact gap.
  r8_runtime_rejection: >-
    The first complete P1 run proved that the 1368 separately closed detent-cam
    wedges expose internal radial partition faces and lock BodyAssembly and
    CouplingNut together.  r8 remains immutable failure evidence and may not be
    relabelled or reused as the successor asset.
  r9_runtime_rejection: >-
    A no-write CPU diagnostic on r8 showed that one continuous analytic base
    cylinder restores relative nut rotation, and that the same base plus 36
    closed convex tooth protrusions preserves relative rotation.  The first
    complete r9 P1 run then failed its premotion gate because the unsupported
    0.20 mm detent preload produced persistent body/nut angular speeds above
    0.02 rad/s.  r9 remains immutable failure evidence and may not be relabelled
    or reused as the successor asset.
  r10_runtime_rejection: >-
    No-write CPU probes on immutable r9 isolated the detent as the premotion
    instability source.  Centering all three followers on the base dwell,
    reducing geometric preload to 1 micrometre, and selecting 130000 N/m with
    2 N*s/m passed the isolated 120-step probe.  The complete r10 P1 scene then
    measured 0.0214424 rad/s at the nut after settle, above the immutable
    0.020 rad/s gate.  r10 remains immutable failure evidence and may not be
    relabelled or reused as the successor asset.
  r11_detent_candidate_probe_result: >-
    No-write parameter probes on immutable r10 selected 110000 N/m with the
    same 1 micrometre preload, 2 N*s/m damping, and dwell-centred phases.  It
    passed the exact 120-step premotion probe with about 0.0020 rad/s nut yaw
    speed and completed positive coupling at both the P1 rate and 5 deg/s
    without the high-energy tooth crossing or lock observed outside the stable
    window.  This authorizes an r11 candidate only; complete P1-P14 acceptance
    remains unpassed.

