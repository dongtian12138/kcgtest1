# DYN-B-GRASP-LIFT-RECOVERY-V2 deterministic control contract.
# Derived from d38999_multilayer_tabletop_physical_grasp_v1.yaml.  The only
# physical-control changes are the evidence-derived consolidation final finger
# stiffness scale (1.0 -> 0.85) and the currently active H6 bumpless arm-drive
# compliance phase plus the single RUN08-derived H7 post-contact finger
# damping transition. Historical H4/H5 sections remain explicit but disabled.
# Geometry, materials and safety gates remain unchanged; the v1 file remains
# immutable historical evidence.
