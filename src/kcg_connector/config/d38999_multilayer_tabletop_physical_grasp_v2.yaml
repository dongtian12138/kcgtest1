  source_run_id: B-V2-GRASP-14
  source_h8_run_id: B-V2-GRASP-05
  source_target_stiffness_n_m: 41024.63885398004
  task_xy_compliance_m_n: 2.4375595445442518e-05
  maximum_total_correction_norm_m: 3.0e-05
  maximum_step_correction_norm_m: 1.0e-06
