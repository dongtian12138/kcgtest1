  threshold_label: SIM_TUNING_ONLY_B_V2_H11
  source_run_id: B-V2-GRASP-12
  reuse_sequential_balance_parameters: true
  zero_mean_closure_coordinate_trim: true
  immediately_preceding_root_torque_only: true

# H17 keeps each synchronized finger-root load near one fresh reference from
# the trailing existing 120-step H13 window.  It replaces H11's runtime
# zero-mean overlay during staged lift, but reuses every H11 numeric bound and
# gain; this section introduces no second numeric parameter set.
lift_finger_absolute_load_hold:
  enabled: true
  threshold_label: SIM_TUNING_ONLY_B_V2_H17
  source_h11_run_id: B-V2-GRASP-13
  source_h16_run_id: B-V2-H16-STIFFNESS-RESTORE-IFIX01
  reference_window_source: TRAILING_H13_TRANSITION_USING_EXISTING_REFERENCE_WINDOW_STEPS
  reuse_sequential_control_parameters: true
  independent_absolute_root_load_hold: true
  immediately_preceding_root_torque_only: true

lift_phase_arm_damping:
  enabled: true
  threshold_label: SIM_TUNING_ONLY_B_V2_H13
  source_lift_run_id: B-V2-GRASP-13
  source_hold_run_id: B-V2-H12-ZERO-LIFT-01
  source_median_velocity_ratio: 2.18824945114135
  initial_damping_nm_s_rad: 400.0
  final_damping_nm_s_rad: 875.29978045654
  transition_steps: 240
  maximum_readback_error: 1.0e-3

# H18 keeps the H6 anchored position target and adds one world-up force ramp
# derived exactly from the frozen 0.23 kg body, 0.08 kg nut and -9.81 m/s^2
# gravity.  Ramp length reuses H13; no independent numeric control parameter
# or contact/object truth branch is introduced here.
lift_task_space_vertical_force_ramp:
  enabled: true
  threshold_label: SIM_TUNING_ONLY_B_V2_H18
  source_h12_run_id: B-V2-H12-ZERO-LIFT-01
  source_h13_run_id: B-V2-GRASP-14
  source_h17_run_id: B-V2-H17-ABSOLUTE-LOAD-HOLD-01
  force_target_source: FROZEN_BODY_PLUS_NUT_WEIGHT
  ramp_steps_source: H13_TRANSITION_STEPS
  world_force_axis: [0.0, 0.0, 1.0]
  keep_position_target_fixed_during_ramp: true
  immediately_preceding_arm_state_only: true
  recompute_mapping_during_staged_lift: true

# H19 preserves every H18 numeric action value but maps the virtual world-up
# load at the handbase sensor origin rather than at the 0.400 m distal grasp
# TCP.  The formal hard gate continues to use the same sensor-origin wrench.
lift_sensor_origin_vertical_force_ramp:
  enabled: false
  threshold_label: SIM_TUNING_ONLY_B_V2_H19
  source_h12_run_id: B-V2-H12-ZERO-LIFT-01
  source_h13_run_id: B-V2-GRASP-14
  source_h17_run_id: B-V2-H17-ABSOLUTE-LOAD-HOLD-01
  source_h18_run_id: B-V2-H18-VERTICAL-FORCE-RAMP-01
  force_target_source: FROZEN_BODY_PLUS_NUT_WEIGHT
  ramp_steps_source: H13_TRANSITION_STEPS
  world_force_axis: [0.0, 0.0, 1.0]
  force_application_frame: handbase_link_sensor_origin
  hard_gate_reference_frame: handbase_link_sensor_origin
  handbase_to_tcp_source: FROZEN_PICK_GEOMETRY_CANDIDATE
  keep_position_target_fixed_during_ramp: true
  immediately_preceding_arm_state_only: true
  recompute_mapping_during_staged_lift: true

# H20 introduces no numeric parameter.  It authorizes the already frozen H14
# XY correction during the H18 pre-lift force ramp so lateral contact load can
# be relieved before the unchanged sensor-origin hard gate is crossed.
pre_lift_vertical_force_xy_admittance:
  enabled: false
  threshold_label: SIM_TUNING_ONLY_B_V2_H20
  source_h14_run_id: B-V2-GRASP-15-IFIX01
  source_h18_run_id: B-V2-H18-VERTICAL-FORCE-RAMP-01
  reuse_h14_xy_parameters: true
  reuse_h18_force_profile: true
  immediately_preceding_task_wrench_only: true
  vertical_position_target_fixed: true
  sensor_origin_hard_gate_unchanged: true
  no_new_numeric_control_parameter: true

# H21 is a causally distinct replacement for H20.  A two-sample arithmetic
# mean has an exact zero at the 240 Hz Nyquist alternating component observed
# in H20.  It changes only the H14 XY control input; raw sensor-origin gates
# and raw evidence stay unfiltered with zero detection delay.
pre_lift_xy_nyquist_suppression:
  enabled: true
  threshold_label: SIM_TUNING_ONLY_B_V2_H21
  source_h20_run_id: B-V2-H20-PRELIFT-XY-ADMITTANCE-01
  two_sample_arithmetic_mean_required: true
  xy_control_input_only: true
  raw_sensor_hard_gate_unchanged: true
  raw_peaks_recorded: true
  hard_gate_detection_delay_steps: 0
  no_new_gain_force_or_geometry_parameter: true

# H22 moves the unchanged H14+H21 lateral controller ahead of H18 unloading.
# Its duration is the already-authorized H13 transition length.  The existing
# 30 um cumulative correction remains shared with the following force ramp.
pre_lift_quasistatic_lateral_preload_nulling:
  enabled: true
  threshold_label: SIM_TUNING_ONLY_B_V2_H22
  source_h21_run_id: B-V2-H21-NYQUIST-SUPPRESSION-01
  steps_source: H13_TRANSITION_STEPS
  zero_vertical_feedforward_required: true
  reuse_h14_xy_parameters: true
  reuse_h21_two_sample_input: true
  retain_correction_into_vertical_ramp: true
  correction_total_bound_reset_forbidden: true
  payload_reference_rebase_forbidden: true
  raw_sensor_hard_gate_unchanged: true
  hard_gate_detection_delay_steps: 0
  no_new_gain_force_or_geometry_parameter: true

# H23 is one diagnostic-only causal probe after H22 and before H18.  The arm
# and vertical force stay fixed while the three existing positive finger-probe
# motions identify the rank-two differential-preload response.  It neither
# applies the derived correction nor claims a B-stage pass.
pre_lift_differential_finger_preload_diagnostic:
  enabled: false
  threshold_label: SIM_TUNING_ONLY_B_V2_H23_DIAGNOSTIC
  source_h22_run_id: B-V2-H22-PREUNLOADING-NULLING-01
  diagnostic_only: true
  finger_probe_order: [f1, f2, f3]
  probe_increment_source: SEQUENTIAL_PROBE_INCREMENT_RAD
  move_steps_source: H4_PROBE_MOVE_STEPS
  settle_steps_source: SEQUENTIAL_PROBE_SETTLE_STEPS
  sample_steps_source: H4_PROBE_SAMPLE_STEPS
  minimum_probe_response_source: SEQUENTIAL_MINIMUM_PROBE_RESPONSE_NM
  arm_target_fixed: true
  vertical_feedforward_zero_required: true
  payload_reference_rebase_forbidden: true
  raw_sensor_hard_gate_unchanged: true
  hard_gate_detection_delay_steps: 0
  object_contact_event_truth_forbidden: true
  correction_applied_in_diagnostic: false

# H23's only structural fix is bound to the completed 456-step Isaac
# diagnostic.  It moves to that one zero-sum correction with the existing H13
# minimum-jerk duration, holds for the existing reference window, refreshes
# only the allowed three root-load references, and then enters unchanged H18.
pre_lift_differential_finger_preload_correction:
  enabled: true
  threshold_label: SIM_TUNING_ONLY_B_V2_H23_FIXED_CORRECTION
  source_run_id: B-V2-H23-DIFFERENTIAL-FINGER-PRELOAD-DIAGNOSTIC-IFIX01
  source_analysis_sha256: 719b942a1739400300ca5a6a7de7a0f8dd13de259934c726452bbfdcd3530946
  fixed_correction_closure_rad: [0.00060507064062471, 0.002476928142280831, -0.003081998782905541]
  correction_norm_limit_source: SEQUENTIAL_PROBE_INCREMENT_RAD
  transition_steps_source: H13_TRANSITION_STEPS
  stability_steps_source: REFERENCE_WINDOW_STEPS
  zero_sum_required: true
  arm_target_fixed_during_correction: true
  vertical_feedforward_zero_required: true
  wrist_payload_reference_rebase_forbidden: true
  root_reference_refresh_from_trailing_stability_window: true
  persistent_via_fresh_h17_equilibrium: true
  raw_sensor_hard_gate_unchanged: true
  hard_gate_detection_delay_steps: 0
  object_contact_event_truth_forbidden: true
  second_parameter_set_allowed: false
  formal_b_pass_claimed_from_fix_window: false

# H24 changes only the H17 control input after two independent dynamic traces
# showed the same one-frame low-load / delayed rebound mechanism.  The fixed
# two-sample arithmetic mean reuses H21's exact Nyquist-zero structure.  Raw
# finger loads and the sensor-origin hard gate remain unfiltered and current.
lift_finger_root_load_two_sample_suppression:
  enabled: false
  threshold_label: SIM_TUNING_ONLY_B_V2_H24
  source_h22_run_id: B-V2-H22-PREUNLOADING-NULLING-01
  source_h23_run_id: B-V2-H23-DIFFERENTIAL-FINGER-PRELOAD-CORRECTION-01
  source_derivation_sha256: b2d12112af3241dfe3301f9de1aac6e827f84874a1f0dbcc5229c6f0675a9b55
  two_sample_arithmetic_mean_required: true
  h17_control_input_only: true
  initialize_by_current_sample_duplication: true
  reset_after_h17_reference_refresh: true
  raw_finger_root_samples_recorded: true
  raw_sensor_hard_gate_unchanged: true
  hard_gate_detection_delay_steps: 0
  no_new_gain_force_or_geometry_parameter: true

# H25 removes the dynamically disproved absolute-load integrator only after
# the H23 correction and stability window.  It freezes the already-realized
# three finger targets through table unloading and staged lift.  No target,
# gain, force, geometry or safety threshold is introduced by this section.
lift_finger_fixed_target_hold:
  enabled: true
  threshold_label: SIM_TUNING_ONLY_B_V2_H25
  source_h24_run_id: B-V2-H24-TWO-SAMPLE-ROOT-LOAD-01
  source_derivation_sha256: 1ef9abedea61d0eb529cb3282a2f3ef6152aa461f2d81cfa27c7dd12c68c9051
  activate_after_h23_stability_window: true
  freeze_current_finger_targets: true
  disable_h17_updates_during_vertical_force_ramp: true
  disable_h17_updates_during_staged_lift: true
  raw_finger_root_samples_recorded: true
  raw_sensor_hard_gate_unchanged: true
  hard_gate_detection_delay_steps: 0
  no_new_numeric_control_parameter: true
  object_contact_event_truth_forbidden: true
  formal_b_pass_claimed_from_hold: false

