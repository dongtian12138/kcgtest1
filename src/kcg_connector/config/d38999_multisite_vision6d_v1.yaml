# Disabled-by-default preparation contract for multi-position D38999 vision.
# It is deliberately not referenced by the current E2E runner.  The present
# proxy has no unique polarization key, so no entry below authorizes control.
schema_version: kcg_d38999_multisite_vision6d_v1
enabled: false
status: prepared_contract_not_e2e_integrated

scope:
  delivery_window_hours: 8.0
  achievable_in_window:
    - deterministic_multisite_scene_contract
    - semantic_rgbd_translation_and_axis_candidate
    - symmetry_aware_pose_provider_gate
    - unqualified_object_target_transform_candidates
    - foundationpose_isolated_container_plan
  not_honestly_claimable_in_window:
    - unique_key_yaw_from_current_proxy
    - vision_authorized_robot_control
    - arbitrary_pose_collision_free_ik
    - real_connector_assembly_success

inputs:
  proxy_config:
    path: src/kcg_connector/config/d38999_shell25j_proxy_v1.yaml
    sha256: 7d1a541a2350b438697497667c7dcb1f2cd69daa3e98ff850c92759b2f6879df
  tabletop_scene:
    path: src/kcg_connector/config/d38999_tabletop_scene_v1.yaml
    sha256: 81872c3e6e884e7455dd4e93e608fc651f0dff0090bab27b1b8c935473f9ba7f
  pose_contract:
    path: src/kcg_connector/config/connector_pose_observation_v1.yaml
    sha256: f961598ebdf59f5f92e5b2820c099134ab95130f5b7dc54a7f115945ed43879c
  proxy_asset:
    path: artifacts/kcg_connector/isaac/d38999_shell25j_61_pair_proxy_v1.usda
    sha256: 6f716b6e40129f98e5914b5597005c575617d5f55cd0f2c0c8df067ee6788740

# These are evaluation bounds, not permission to move the current E2E scene.
# Z stays fixed so both objects remain on their current table/fixture support.
placement_randomization:
  seed_policy: explicit_integer_seed
  loose_plug:
    x_m: [0.485, 0.555]
    y_m: [-0.245, -0.175]
    origin_z_m: 0.215
    yaw_rad: [-3.141592653589793, 3.141592653589793]
    footprint_radius_m: 0.024
    support: table
  fixed_receptacle:
    x_m: [0.535, 0.565]
    y_m: [0.170, 0.200]
    origin_z_m: 0.2615
    yaw_rad: [-3.141592653589793, 3.141592653589793]
    footprint_radius_m: 0.023
    support: fixture_moves_with_receptacle
  paired_constraints:
    minimum_center_separation_m: 0.300
    table_xy_bounds_m: [0.150, 0.950, -0.450, 0.450]
    required_anchor_pairs:
      - id: nominal
        loose_xy_m: [0.520, -0.210]
        fixed_xy_m: [0.550, 0.185]
      - id: loose_left_fixed_right
        loose_xy_m: [0.485, -0.245]
        fixed_xy_m: [0.565, 0.200]
      - id: loose_right_fixed_left
        loose_xy_m: [0.555, -0.175]
        fixed_xy_m: [0.535, 0.170]
      - id: cross_corner_a
        loose_xy_m: [0.485, -0.175]
        fixed_xy_m: [0.565, 0.170]
      - id: cross_corner_b
        loose_xy_m: [0.555, -0.245]
        fixed_xy_m: [0.535, 0.200]

camera_visibility:
  existing_global_camera:
    available: true
    prim_path: /World/D38999TabletopV1/RgbdCamera
    frame_id: d38999_rgbd_camera_optical
    resolution_px: [640, 480]
  future_wrist_camera:
    available: false
    required_for_unique_key_confirmation: true
    blocker: no_wrist_rgbd_asset_or_hand_eye_calibration
  gates:
    minimum_center_margin_px: 32
    minimum_mask_pixels_per_endpoint: 150
    minimum_visible_fraction_per_endpoint: 0.0004
    minimum_valid_depth_fraction_in_mask: 0.95
    maximum_occlusion_fraction: 0.35
    required_views_for_translation_axis: 1
    required_views_for_key_yaw: 2

geometric_rgbd_estimator:
  enabled: false
  dependencies: [python_stdlib, numpy_already_present]
  pipeline:
    - semantic_mask_to_registered_depth_points
    - robust_depth_outlier_rejection
    - known_proxy_axial_envelope_fit
    - pointcloud_pca_axis_initialization
    - symmetry_aware_cad_icp_refinement
  capability_claims:
    translation_xyz_candidate: true
    connector_axis_candidate: true
    roll_pitch_candidate: true
    unique_key_yaw_candidate: false
  gates:
    maximum_translation_std_m: 0.005
    maximum_cad_fit_rmse_m: 0.003
    maximum_axis_error_rad: 0.03490658503988659
    minimum_axis_inlier_fraction: 0.70
    minimum_unique_yaw_score_margin: 0.15

symmetry_and_keying:
  current_proxy_has_unique_polarization_key: false
  body_and_receptacle_minimum_yaw_symmetry_order: 2
  equivalent_yaw_period_rad: 3.141592653589793
  # Rotational orders come from the generated concentric contact rings
  # (6/12/18/24), 20-segment mating/entry shells, four flange slots, and the
  # 24-segment nut.  gcd(...) = 2 for each endpoint's complete appearance.
  periodic_component_orders:
    loose_body: [6, 12, 18, 24, 20]
    fixed_receptacle: [6, 12, 18, 24, 20, 4]
    coupling_nut: [24]
  coupling_nut_is_independent_yaw_body: true
  contact_pattern_is_visual_only: true
  required_before_keyed_yaw_claim:
    - add_measured_unique_key_geometry_to_proxy_or_registered_cad
    - observe_key_in_at_least_one_calibrated_view
    - reject_all_symmetry_equivalent_hypotheses
    - validate_yaw_against_withheld_truth_over_all_anchor_pairs

# These transforms make the intended frame algebra reviewable.  They are
# proxy-derived candidates, not calibrated transforms in the shared pose
# contract, and therefore remain control-ineligible.
object_target_transforms:
  convention: parent_T_child
  quaternion_convention: xyzw
  candidates:
    - transform_id: d38999_loose_object_T_grasp_tcp_candidate_v1
      model_id: d38999_26kj61sn_proxy_v1
      kind: grasp
      parent_frame_id: d38999_26kj61sn_body_object
      child_frame_id: d38999_top_down_grasp_tcp_candidate
      translation_xyz_m: [0.0, 0.0, 0.04848]
      quaternion_xyzw: [0.19073322597108375, 0.9816419084934265, -0.000000001845583392825855, 0.00000021627256602512928]
      provenance: pure_urdf_fk_at_current_nominal_grasp_and_proxy_body_origin
      qualified: false
    - transform_id: d38999_loose_object_T_assembly_candidate_v1
      model_id: d38999_26kj61sn_proxy_v1
      kind: assembly
      parent_frame_id: d38999_26kj61sn_body_object
      child_frame_id: d38999_loose_socket_face_assembly_candidate
      translation_xyz_m: [0.0, 0.0, 0.0]
      quaternion_xyzw: [0.0, 0.0, 0.0, 1.0]
      provenance: proxy_socket_face_root
      qualified: false
    - transform_id: d38999_fixed_object_T_assembly_candidate_v1
      model_id: d38999_20kj61pn_proxy_v1
      kind: assembly
      parent_frame_id: d38999_20kj61pn_receptacle_object
      child_frame_id: d38999_fixed_contact_face_assembly_candidate
      translation_xyz_m: [0.0, 0.0, 0.0]
      quaternion_xyzw: [0.0, 0.0, 0.0, 1.0]
      provenance: proxy_receptacle_contact_face_root
      qualified: false

pose_control_gate:
  provider_schema: kcg_connector_pose_provider_sample_v1
  required_pose_source: vision
  require_both_endpoints: true
  require_full_6d: true
  require_keyed_orientation_observed: true
  require_no_truth_position: true
  require_no_truth_orientation: true
  require_all_target_transforms_qualified: true
  current_control_authorized: false

# Preferred route is an isolated Isaac ROS container; do not mutate the host
# ROS/Isaac Sim environment while this contract is disabled.
foundationpose:
  integration_enabled: false
  preferred_adapter: isaac_ros_foundationpose
  preferred_environment: isolated_isaac_ros_container
  host_assessment_date: "2026-08-12"
  host_ros_distribution: humble
  current_official_isaac_ros_release: release-4.5
  current_official_ros_distribution: jazzy
  ngc_model_version: 1.0.1_onnx
  ngc_compressed_size_mb: 125.95
  inference_runtime: TensorRT
  minimum_recommended_gpu_memory_gb: 8.0
  model_license: NVIDIA_Model_EULA
  ros_wrapper_license: Apache-2.0
  nvlabs_reference_code_license: NVIDIA_Source_Code_License
  official_sources:
    documentation: https://nvidia-isaac-ros.github.io/repositories_and_packages/isaac_ros_pose_estimation/isaac_ros_foundationpose/
    ros_source: https://github.com/NVIDIA-ISAAC-ROS/isaac_ros_pose_estimation
    reference_code: https://github.com/NVlabs/FoundationPose
    model_card: https://catalog.ngc.nvidia.com/orgs/nvidia/teams/isaac/models/foundationpose
    refine_onnx: https://api.ngc.nvidia.com/v2/models/nvidia/isaac/foundationpose/versions/1.0.1_onnx/files/refine_model.onnx
    score_onnx: https://api.ngc.nvidia.com/v2/models/nvidia/isaac/foundationpose/versions/1.0.1_onnx/files/score_model.onnx
  required_asset_paths:
    refine_onnx: isaac_ros_assets/models/foundationpose/refine_model.onnx
    score_onnx: isaac_ros_assets/models/foundationpose/score_model.onnx
    refine_engine: isaac_ros_assets/models/foundationpose/refine_trt_engine.plan
    score_engine: isaac_ros_assets/models/foundationpose/score_trt_engine.plan
    object_mesh: isaac_ros_assets/meshes/d38999_proxy_simplified.obj
  blockers:
    - isaac_ros_environment_not_installed
    - tensorrt_and_trtexec_not_available_on_host_path
    - onnx_models_not_downloaded_or_eula_accepted
    - tensorrt_engine_plans_not_built
    - simplified_obj_mesh_not_exported_and_validated
    - aligned_rgb_depth_camera_info_and_segmentation_bridge_not_built
    - current_proxy_has_no_unique_polarization_key
    - camera_to_world_and_future_hand_eye_calibration_not_qualified

boundaries:
  e2e_integration_allowed: false
  object_pose_writes_after_start_allowed: false
  host_package_install_allowed: false
  model_download_performed: false
  tensorrt_engine_build_performed: false
  calibrated_transform_claimed: false
  unique_key_yaw_claimed: false
  vision_control_authorized: false
  real_assembly_success_claimed: false
