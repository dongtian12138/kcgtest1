# Disabled, side-by-side migration design for correcting the D38999 proxy
# symmetry declarations.  This file never replaces the active v1 registry and
# is not imported by the E2E runner.
schema_version: kcg_d38999_pose_registry_v2_migration_v1
enabled: false
status: audit_confirmed_v2_designed_not_activated

inputs:
  active_pose_registry_v1:
    path: src/kcg_connector/config/connector_pose_observation_v1.yaml
    sha256: f961598ebdf59f5f92e5b2820c099134ab95130f5b7dc54a7f115945ed43879c
  proxy_definition:
    path: src/kcg_connector/config/d38999_shell25j_proxy_v1.yaml
    sha256: 7d1a541a2350b438697497667c7dcb1f2cd69daa3e98ff850c92759b2f6879df
  loose_body_obj:
    path: artifacts/kcg_connector/foundationpose_1.0.1_onnx_local_v1/meshes/d38999_26kj61sn_loose_body_proxy_v1.obj
    sha256: 861c412ea34c1c4c9485534e03be9a92c59645c6960ec00326bc35faed47b0f1
  fixed_receptacle_obj:
    path: artifacts/kcg_connector/foundationpose_1.0.1_onnx_local_v1/meshes/d38999_20kj61pn_fixed_receptacle_proxy_v1.obj
    sha256: aef8938b3df2f81bde963c22cd816231546438425ab1bdabeb39d8eeb62214fa
  coupling_nut_obj:
    path: artifacts/kcg_connector/foundationpose_1.0.1_onnx_local_v1/meshes/d38999_26kj61sn_coupling_nut_proxy_v1.obj
    sha256: 0386d4ba332b74044db144ad9693d056e4f9969ce8784718b16ef6a433cc8b45

current_mismatch:
  active_declared_symmetry_class: keyed_order_1
  affected_model_ids:
    - d38999_26kj61sn_proxy_v1
    - d38999_20kj61pn_proxy_v1
  # The audit compares the complete OBJ vertex multiset after each declared
  # object-frame +Z rotation.  Seven decimal places are one tenth micrometre
  # in these metre-scale meshes and absorb only decimal serialization noise.
  geometry_audit_method: quantized_obj_vertex_multiset_under_axial_rotation
  coordinate_decimal_places: 7
  observed_objects:
    loose_plug:
      mesh_input: loose_body_obj
      minimum_rotational_symmetry_order: 2
      required_verified_orders: [2]
      unique_key_geometry_present: false
    fixed_receptacle:
      mesh_input: fixed_receptacle_obj
      minimum_rotational_symmetry_order: 2
      required_verified_orders: [2]
      unique_key_geometry_present: false
    coupling_nut:
      mesh_input: coupling_nut_obj
      minimum_rotational_symmetry_order: 24
      required_verified_orders: [2, 3, 4, 6, 8, 12, 24]
      unique_key_geometry_present: false
  consequences:
    v1_d38999_vision_pair_publication_safe: false
    v1_d38999_vision_control_safe: false
    polarization_label_counts_as_geometry_evidence: false

proposed_v2:
  contract_schema_version: kcg_connector_pose_contract_v2
  observation_schema_version: kcg_connector_pose_observation_v2
  symmetry_schema_version: kcg_connector_object_symmetry_v1
  migration_mode: side_by_side_no_in_place_upgrade
  v1_remains_runtime_default: true
  v2_runtime_registration_enabled: false
  # Symmetry acts on the right because parent_T_object * object_T_symmetry is
  # another equivalent object pose under the parent_T_child convention.
  group_action: right_multiply_object_frame_rotation
  model_registry:
    - model_id: d38999_26kj61sn_proxy_v1
      role: loose_plug
      object_frame_id: d38999_26kj61sn_body_object
      geometry_input: loose_body_obj
      compatible_model_ids: [d38999_20kj61pn_proxy_v1]
      symmetry:
        kind: discrete_axial
        axis_in_object_frame_xyz: [0.0, 0.0, 1.0]
        order: 2
        equivalent_yaw_period_rad: 3.141592653589793
        unique_key_geometry_present: false
        pose_semantics: equivalence_class
    - model_id: d38999_20kj61pn_proxy_v1
      role: fixed_receptacle
      object_frame_id: d38999_20kj61pn_receptacle_object
      geometry_input: fixed_receptacle_obj
      compatible_model_ids: [d38999_26kj61sn_proxy_v1]
      symmetry:
        kind: discrete_axial
        axis_in_object_frame_xyz: [0.0, 0.0, 1.0]
        order: 2
        equivalent_yaw_period_rad: 3.141592653589793
        unique_key_geometry_present: false
        pose_semantics: equivalence_class
  component_registry:
    - component_id: d38999_26kj61sn_coupling_nut_proxy_v1
      parent_model_id: d38999_26kj61sn_proxy_v1
      independent_rigid_body: true
      geometry_input: coupling_nut_obj
      symmetry:
        kind: discrete_axial
        axis_in_object_frame_xyz: [0.0, 0.0, 1.0]
        order: 24
        equivalent_yaw_period_rad: 0.2617993877991494
        unique_key_geometry_present: false
        pose_semantics: equivalence_class
  v1_bridge:
    affected_d38999_observations_are_lossless: false
    allow_evaluation_only_diagnostic_bridge: true
    allow_pair_publication: false
    allow_control: false
    required_bridge_diagnostic: v1_keyed_order_1_cannot_represent_c2_pose_equivalence

key_geometry_upgrade:
  status: blocked_missing_hash_bound_key_geometry
  selected_identity:
    loose_part_number: D38999/26KJ61SN
    fixed_part_number: D38999/20KJ61PN
    insert_arrangement: 61
    polarization: N
    identity_label_is_geometry_evidence: false
  acceptable_primary_geometry_sources:
    - licensed_vendor_cad_for_exact_orderable_part_numbers
    - calibrated_metrology_or_scan_of_traceable_physical_mates
  public_shell_outline_drawings_sufficient: false
  required_source_records:
    - source_or_specification_identifier
    - license_and_redistribution_boundary
    - exact_part_number_and_polarization_traceability
    - units_scale_and_coordinate_frame
    - original_file_sha256
    - derived_mesh_sha256_and_reproducible_conversion
    - dimensional_or_scan_uncertainty
  required_key_records:
    - asymmetric_plug_polarization_feature_geometry
    - matching_receptacle_polarization_feature_geometry
    - plug_object_frame_key_reference_direction
    - receptacle_object_frame_key_reference_direction
    - mating_key_angle_and_tolerance
    - calibrated_object_to_assembly_transforms
  keyed_upgrade_model_ids:
    loose_plug: d38999_26kj61sn_keyed_proxy_v2
    fixed_receptacle: d38999_20kj61pn_keyed_proxy_v2
  reuse_v1_model_ids_for_changed_geometry_allowed: false
  manually_drawn_or_guessed_key_allowed: false

foundationpose_evaluation:
  output_interpretation: pose_equivalence_class_not_unique_keyed_pose
  endpoint_metric: minimum_se3_orientation_error_over_declared_symmetry_group
  group_action: estimated_parent_T_object_right_multiply_object_T_symmetry
  translation_metric: euclidean_3d
  axis_metric: unsigned_object_axis_angle
  raw_yaw_error_reportable_as_keyed_accuracy: false
  canonical_representative_may_authorize_control: false
  pair_hypothesis_policy: retain_all_loose_fixed_symmetry_combinations
  temporal_policy: preserve_hypothesis_identity_and_reject_unexplained_branch_flips
  coupling_nut_policy: evaluate_separately_modulo_order_24
  keyed_yaw_field_for_current_proxy: null
  required_shadow_evidence:
    - withheld_truth_not_used_by_candidate_generation
    - all_required_randomized_anchor_poses
    - translation_axis_and_modulo_symmetry_orientation_metrics
    - covariance_or_hypothesis_confidence_calibration
    - occlusion_and_out_of_distribution_rejection

control_authorization:
  current_authorized: false
  evaluation_or_preflight_pair_publication:
    possible_after_v2_registry_activation: true
    required_gates:
      - content_addressed_v2_registry_loaded_by_v2_parser
      - both_endpoint_outputs_publish_equivalence_classes
      - modulo_symmetry_accuracy_passes_withheld_truth_thresholds
      - timing_calibration_confidence_and_ood_gates_pass
  symmetry_invariant_pick_only:
    possible_in_future: true
    required_gates:
      - every_grasp_and_collision_result_valid_for_every_symmetry_hypothesis
      - no_unique_keyed_yaw_claim
      - stage_scoped_controller_cannot_enter_insertion_or_twist
      - repeated_closed_loop_pick_regression_passes
  keyed_assembly_full_workflow:
    possible_in_future: true
    required_gates:
      - hash_bound_keyed_geometry_uses_new_model_ids
      - key_feature_observed_or_fixed_mate_key_frame_independently_calibrated
      - all_symmetry_equivalent_false_hypotheses_rejected
      - relative_key_yaw_accuracy_passes_withheld_randomized_trials
      - qualified_object_to_grasp_and_object_to_assembly_transforms
      - collision_force_torque_and_repeatability_gates_pass
      - pose_provider_control_purpose_has_no_truth_pose_components
  force_guided_key_search_alternative_covered_by_this_contract: false

migration_phases:
  - id: phase_0_quarantine
    complete: true
    exit_criterion: v1_mismatch_is_hash_bound_and_d38999_vision_control_is_blocked
  - id: phase_1_side_by_side_schema
    complete: false
    exit_criterion: independent_v2_parser_and_registry_tests_pass_without_runtime_wiring
  - id: phase_2_shadow_pose_evaluation
    complete: false
    exit_criterion: foundationpose_metrics_pass_modulo_symmetry_on_withheld_truth
  - id: phase_3_keyed_geometry_revision
    complete: false
    exit_criterion: traceable_key_geometry_and_calibrated_key_frames_use_new_model_ids
  - id: phase_4_stage_scoped_control
    complete: false
    exit_criterion: all_selected_stage_authorization_gates_pass_repeated_regression

boundaries:
