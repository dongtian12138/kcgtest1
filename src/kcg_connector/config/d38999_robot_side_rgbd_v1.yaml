# Robot-side near-field fixed RGB-D feasibility candidate.
# This camera is intentionally world-fixed and is not mounted on the hand or
# on the grasped Plug.  It is a first-alternative authoring candidate after
# the original fixed camera was judged pixel-infeasible.
schema_version: kcg_d38999_rgbd_bootstrap_v1
tabletop_config: src/kcg_connector/config/d38999_tabletop_scene_v1.yaml
pose_contract_config: src/kcg_connector/config/connector_pose_observation_v1.yaml

camera:
  prim_path: /World/D38999TabletopV1/RobotSideRgbdCamera
  frame_id: d38999_robot_side_camera_optical
  # Near-field overhead stand on the robot/service-platform side.  The two
  # display poses place the upward-facing Plug mating face about 0.35 m below
  # this camera and laterally offset by about +-0.05 m.
  eye_m: [0.520, -0.210, 0.620]
  target_m: [0.450, -0.185, 0.365]
  resolution: [640, 480]
  frequency_hz: 20
  warmup_frames: 5

labels:
  taxonomy: class
  loose_plug: d38999_loose_plug
  fixed_receptacle: d38999_fixed_receptacle

position_estimator:
  kind: ray_plane_registered_model_height
  mask_center_statistic: coordinatewise_median_semantic_mask_pixels
  loose_plug_registered_model_height_m: 0.360
  loose_plug_registered_model_height_source: robot_side_display_nominal_plug_center_z
  fixed_receptacle_registered_model_height_m: 0.25575
  fixed_receptacle_registered_model_height_source: receptacle_datum_plus_axial_envelope_midpoint_offset

acceptance:
  minimum_pixels_per_endpoint: 150
  minimum_visible_fraction_per_endpoint: 0.0004
  minimum_valid_depth_m: 0.10
  maximum_valid_depth_m: 2.00
  maximum_xy_centroid_error_m: 0.010

output:
  directory: artifacts/kcg_connector/d38999_robot_side_rgbd_v1
  rgb_filename: rgb.png
  depth_preview_filename: depth_preview.png
  depth_numpy_filename: depth_m.npy
  semantic_preview_filename: semantic_preview.png
  report_filename: report.json
