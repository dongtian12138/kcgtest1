# Deterministic physical tabletop grasp experiment.  Every numeric threshold
# in detector/controller sections is simulation tuning only, not hardware
# calibration and not a fingertip force threshold.
schema_version: kcg_d38999_tabletop_physical_grasp_v1

base:
  pick_config: src/kcg_connector/config/d38999_tabletop_pick_v2_fast.yaml
  tabletop_config: src/kcg_connector/config/d38999_tabletop_scene_v1.yaml
  wrist_ft_config: src/kcg_connector/config/d38999_wrist_ft_monitor_v1.yaml
  hand_frame: handbase_link
  physics_rate_hz: 240

detector:
  threshold_label: SIM_TUNING_ONLY
  lowpass_alpha: 0.18
  derivative_alpha: 0.15
  contact_sigma_multiplier: 6.0
  minimum_contact_delta_nm: 0.020
  release_ratio: 0.45
  minimum_release_delta_nm: 0.008
  minimum_rise_rate_nm_s: 0.040
  maximum_stall_velocity_rad_s: 0.020
  minimum_tracking_error_rad: 0.004
  confirm_steps: 12
  release_confirm_steps: 18
  maximum_sample_gap_s: 0.0125
  position_velocity_window_steps: 6

sequential:
  approach_rate_rad_s: 0.18
  soft_hold_preload_rad: 0.006
  load_build_rate_rad_s: 0.010
  balance_gain_rad_per_load: 0.0015
  maximum_balance_step_rad: 0.0010
  maximum_balance_total_rad: 0.030
  probe_increment_rad: 0.004
  probe_settle_steps: 24
  minimum_probe_response_nm: 0.002
  maximum_probe_cross_coupling_ratio: 2.5
  load_scale_nm: [0.30, 0.30, 0.30]
  # SIM_TUNING_ONLY_B_CANDIDATE: require a load level at least as high as
  # the successful headless seed-0 closure tail before freezing the grasp.
  # This is a grasp-readiness criterion, not a wrist-force safety gate.
  stable_minimum_normalized_load: 0.40
  maximum_normalized_load_imbalance: 0.35
  stable_confirm_steps: 48
  maximum_approach_steps: 1440
  maximum_load_build_steps: 720
  # Independent SOFT_HOLD window (SIM_TUNING_ONLY): after every finger is
  # CONFIRMED the controller keeps low stiffness for this many full physics
  # steps before any LOAD_BUILD/probe activity.  The probe initial settle
  # (probe_settle_steps) still runs independently afterwards.
  soft_hold_window_steps: 24
  approach_stiffness: 5.0
  soft_hold_stiffness: 1.75
  damping: 1.0
  # Lift-readiness consolidation (SIM_TUNING_ONLY_A_CANDIDATE): after
  # STABLE_CONTACT the three finger targets freeze bit-exact and the
  # per-finger stiffness scale ramps soft_hold_stiffness_scale -> final
  # over consolidation_ramp_steps physics steps, then holds for
  # consolidation_window_steps steps.  Only a full clean pass under the
  # frozen lift gates yields LIFT_READY.  Falsifiable first candidate:
  # not a hardware threshold and not a safety law.  Step counts are
  # physics steps at physics_rate_hz (240 Hz => 120 steps = 0.5 s,
  # 240 steps = 1.0 s).
  consolidation_threshold_label: SIM_TUNING_ONLY_A_CANDIDATE
  soft_hold_stiffness_scale: 0.35
  consolidation_final_stiffness_scale: 1.0
  consolidation_ramp_steps: 120
  consolidation_window_steps: 240

synchronous:
  closure_duration_s: 3.5
  preload_duration_s: 0.5

# Pure single-finger contact/release characterization.  Every gate below is
# SIM_TUNING_ONLY and bounded; none of them changes the 8 N / 0.30 N*m lift
# gates or the existing detector thresholds.  The two rates intentionally
# reuse the sequential approach_rate_rad_s value.
# Frozen fail-closed validation gates for realized arm targets
# (SIM_TUNING_ONLY).  These bounds validate the offset-FK solve; they are
# NOT part of the realized payload/hash and do not depend on the method.
randomization_validation:
  threshold_label: SIM_TUNING_ONLY
  maximum_arm_joint_delta_rad: 0.05
  maximum_fk_position_error_m: 1.0e-7
  maximum_fk_rotation_error_rad: 1.0e-7

single_finger:
  threshold_label: SIM_TUNING_ONLY
  soft_hold_steps: 24
  minimum_release_travel_rad: 0.05
  maximum_release_tracking_error_rad: 0.05
  # Release budget must cover the full commanded opening span plus the
  # discrete filter tail, tracking lag and confirm window: the frozen
  # preflight lower bound for the current targets/gates is 1133 steps
  # (gate = pick sensing maximum_absolute_torque_delta_nm = 2.0 N*m).
  maximum_release_steps: 1200
  maximum_approach_steps: 1440
  approach_rate_rad_s: 0.18
  release_rate_rad_s: 0.18

# Evidence-only reference window diagnostics.  Nothing here gates control.
# Record raw mean/std and first/second-half drift; no pass/fail drift bound is
# declared until the ordinary-table characterization data justify one.
reference:
  window_steps: 120
  evidence_only: true

# Characterization-only zero-lift hold.  The exact grasped arm/hand command
# is held for this bounded duration under the original monitor; the episode
# can never become a grasp PASS in this mode.
zero_lift_hold:
  duration_s: 5.0
  maximum_duration_s: 30.0

# Log-only terminal evaluator truth snapshot after the formal gate triggers.
# The snapshot never feeds commands, recovery planning or the PASS decision.
terminal_evaluator:
  lift_started_dz_m: 0.0005
  posthoc_truth_evaluation_only: true

# FASTLIFT CANDIDATE: 2.5x stage speeds and shorter settle holds.
# Every lift GATE stays byte-identical to v1 (8 N wrist force,
# 0.30 N*m wrist moment, 2.0 N*m finger torque, tracking/velocity
# bounds); only the motion cadence changes.  This file is a re-validation
# candidate: it becomes the frozen contract only after a clean 30/30
# seed batch under the unchanged gates.
lift:
  stage_increment_m: [0.002, 0.010, 0.040]
  stage_speed_m_s: [0.005, 0.010, 0.020]
  stage_hold_s: [0.25, 0.25, 1.50]
  maximum_root_torque_delta_nm: 2.0
  minimum_retained_load_fraction: 0.45
  maximum_normalized_load_imbalance: 0.80
  maximum_load_rate_nm_s: 25.0
  maximum_wrist_force_n: 8.0
  maximum_wrist_moment_nm: 0.30
  maximum_arm_tracking_error_rad: 0.030
  maximum_finger_speed_rad_s: 0.80
  loss_confirm_steps: 18

# Bounded recovery for a failed lift sensor gate.  Recovery replays the
# already-commanded arm targets in reverse (half forward speed), settles at
# the pre-lift target, then opens the fingers on a minimum-jerk profile.
recovery:
  return_steps_per_waypoint: 2
  settle_steps: 120
  open_duration_s: 3.5

# Field-addressed deterministic randomization (schema kcg_d38999_randomization_v1).
# Interval pairs are [low, high] inclusive and must not be booleans.
# finger_start_delay_steps is a DISCRETE set of physical timing slots; it
# must contain 0 and only unique non-negative integers.  A field-addressed
# hash selects one anchor finger whose realized delay is exactly 0; the
# other two fingers draw directly from the set, so every realized delay is
# an original member of the configured set (no difference arithmetic).
# Friction uses conditional sampling: dynamic is drawn first, then static
# from [max(dynamic, static_low), static_high]; the loader rejects ranges
# that cannot guarantee static >= dynamic.
randomization:
  plug_x_offset_m: [-0.0005, 0.0005]
  plug_y_offset_m: [-0.0005, 0.0005]
  plug_yaw_deg: [-5.0, 5.0]
  arm_center_error_x_m: [-0.0003, 0.0003]
  arm_center_error_y_m: [-0.0003, 0.0003]
  finger_start_delay_steps: [0, 5, 12, 24, 36]
  table_static_friction: [0.80, 1.00]
  table_dynamic_friction: [0.65, 0.85]
  fingertip_static_friction: [1.20, 1.60]
  fingertip_dynamic_friction: [1.20, 1.60]
  plug_mass_scale: [0.90, 1.10]
  center_of_mass_offset_m: [-0.001, 0.001]
  lift_speed_scale: [0.90, 1.10]

posthoc_acceptance:
  minimum_total_lift_m: 0.045
  minimum_hold_s: 2.0
  maximum_hand_plug_translation_drift_m: 0.005
  maximum_hand_plug_rotation_drift_rad: 0.08726646259971647
  maximum_table_penetration_m: 0.002

boundaries:
  magnetic_force_allowed: false
  pregrasp_latch_allowed: false
  world_to_plug_joint_allowed: false
  object_actuator_allowed: false
  object_pose_write_after_reset_allowed: false
  contact_truth_in_controller_allowed: false
  post_grasp_stabilization_proxy_enabled: false
  full_skill_rl_enabled: false
