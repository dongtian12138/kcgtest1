  nut_regrasp_cpu_search_report:
    path: artifacts/kcg_connector/d38999_nut_regrasp_search_v1/report.yaml
    sha256: 0981f43424345172b0212d1568ccd42bebc582a7790b1961238c486dc11bd1ac
  virtual_wrist_ft_monitor:
    path: src/kcg_connector/config/d38999_wrist_ft_monitor_v1.yaml
    sha256: a7afc437031a36f67471fa1d785136997315b95df9298b0efb866ed538e79f89
  assembly_baseline:
    path: src/kcg_connector/config/d38999_assembly_baseline_v1.yaml
    sha256: 4921246d03bbfead0c0c806402dadeb432ae913d66ba18c43cc179cb11d76f62

ready_input_boundary:
  schema_version: kcg_d38999_tactile_ready_center_v1
  required_state: READY_FOR_EXISTING_PROXY_TWIST
  required_visual_status: ELIGIBLE_FOR_INDEPENDENT_VISUAL_XY_PROBE
  require_same_capture_id: true
  required_task_frame_id: connector_task_frame
  tactile_offset_source: accepted_force_moment_search_offset_xy
  tactile_offset_input_coordinates: task_frame_xy
  accepted_center_formula: visual_fixed_world_delta_xy_plus_task_rotation_world_times_tactile_task_xy
  require_truth_not_used_for_visual_translation: true
  require_truth_not_used_for_tactile_search: true
  require_posthoc_truth_not_used_for_target: true

task_frame_contract:
  rotation_storage: columns_are_task_axes_expressed_in_world
  rotation_source: assembly_fixed_axis_plus_wrist_ft_x_reference
  maximum_orthogonality_error: 0.000000000001
  maximum_determinant_error: 0.000000000001
  maximum_expected_rotation_error: 0.000000000001
  require_task_xy_plane_parallel_world_xy: true
  maximum_task_xy_world_z_component: 0.000000000001
  tactile_to_world_formula: task_rotation_world_times_dx_dy_zero
  world_target_uses_xy_only: true

target_adapter:
  target_order: [axis_high, preinsert, engage_hold, nut_only_regrasp, safe_retreat]
  post_ready_execution_order: [engage_hold, nut_only_regrasp, safe_retreat]
  nominal_fixed_xy_m: [0.550, 0.185]
  preserve_nominal_z: true
  preserve_nominal_orientation: true
  shift_world_xy_only: true
  fixed_q7_local_ik: true
  nut_only_regrasp_source: nut_regrasp_physx.nut_only_candidate
  safe_retreat_source: physical_insertion.motion.transport_safe

local_fixed_q7_ik:
  maximum_iterations: 50
  damping: 0.000001
  maximum_fk_position_error_m: 0.0000001
  maximum_fk_orientation_error_rad: 0.0000001
  maximum_abs_joint_delta_from_nominal_rad: 0.200
  q7_preserved_per_target: true

output:
  cpu_sample_artifact: artifacts/kcg_connector/d38999_visual_tactile_regrasp_adapter_v1/cpu_sample_plan.json

boundaries:
  explicit_opt_in_required: true
  ready_state_required: true
  truth_position_used_for_target: false
  truth_pose_feedback_used_for_target: false
  sim_truth_audit_used_for_target: false
  task_xy_assumed_equal_to_world_xy: false
  orientation_estimated_from_rgbd: false
  existing_runner_modified: false
  active_config_modified: false
  robot_or_connector_asset_modified: false
  frozen_baseline_modified: false
  collision_planned: false
  continuous_collision_verified: false
  tactile_engage_executed: false
  regrasp_executed: false
  twist_executed: false
  retreat_executed: false
  home_return_executed: false
  gpu_or_physx_validated: false
  production_control_authorized: false
  assembly_success_claimed: false
