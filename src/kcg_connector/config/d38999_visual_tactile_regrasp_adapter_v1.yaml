# Disabled-by-default CPU seam for carrying the accepted visual+tactile XY
# center into the existing assembly target family.  The input must already be
# latched in READY_FOR_EXISTING_PROXY_TWIST; this file does not run tactile
# search, Isaac, PhysX, regrasp, twist, retreat, or Home.
schema_version: kcg_d38999_visual_tactile_regrasp_adapter_v1
enabled_by_default: false
status: prepared_cpu_target_adapter_ready_input_required_not_gpu_validated

inputs:
  visual_xy_adapter:
    path: src/kcg_connector/config/d38999_visual_xy_control_adapter_v1.yaml
