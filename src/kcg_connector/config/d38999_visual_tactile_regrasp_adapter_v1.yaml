  nut_regrasp_physx:
    path: src/kcg_connector/config/d38999_nut_regrasp_physx_v1.yaml
    sha256: 50799ed6ab595885b992d311c60f01bf2b4948cf7fe86a45dfdad232c38bf77f
  nut_regrasp_cpu_search:
    path: src/kcg_moveit_collision_audit/config/d38999_nut_regrasp_search_v1.yaml
