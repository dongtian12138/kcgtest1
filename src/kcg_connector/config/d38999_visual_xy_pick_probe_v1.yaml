# Independent opt-in experiment: one non-nominal loose-plug pick controlled
# by the registered-height ray-plane XY estimate.  The existing E2E, assets,
# and frozen baselines do not reference this contract.
schema_version: kcg_d38999_visual_xy_pick_probe_v1
enabled_by_default: false
status: prepared_independent_visual_xy_pick_probe

inputs:
  visual_xy_adapter:
    path: src/kcg_connector/config/d38999_visual_xy_control_adapter_v1.yaml
    sha256: 748c4f5e2c07c678e8bbb395b3a3ef3d656dea035fbebe09ee66886545148431
  nominal_pick:
    path: src/kcg_connector/config/d38999_tabletop_pick_v1.yaml
    sha256: dce6f4824b1cf7579cb1937dfb2b23d8f14b80d77776fb131e13f3d4e0551179
  tabletop_scene:
    path: src/kcg_connector/config/d38999_tabletop_scene_v1.yaml
    sha256: 81872c3e6e884e7455dd4e93e608fc651f0dff0090bab27b1b8c935473f9ba7f
  rgbd_config:
    path: src/kcg_connector/config/d38999_rgbd_bootstrap_v1.yaml
    sha256: 25c77b8c8d999635eecf1ec5e18454336f7aa6a240b09b338c72a965a460166f

trial:
  trial_id: loose_plus_10mm_xy_fixed_nominal
  author_before_physics: true
  loose_plug_xy_m: [0.530, -0.200]
  fixed_receptacle_xy_m: [0.550, 0.185]
  orientation_source: registered_nominal
  loose_yaw_rad: 0.0
  fixed_yaw_rad: 0.0

rgbd_observation:
  estimator_kind: ray_plane_registered_model_height_world_xy_only
  confidence_kind: minimum_normalized_visibility_depth_gate_score
  per_capture_xy_error_bound_source: five_anchor_empirical_10mm_contract
  per_capture_xy_error_bound_m: 0.010
  truth_xy_keys_forbidden_in_provider_adapter_path: true

local_fixed_q7_ik:
  maximum_iterations: 50
  damping: 0.000001
  maximum_fk_position_error_m: 0.0000001
  maximum_fk_orientation_error_rad: 0.0000001
  maximum_abs_joint_delta_from_nominal_rad: 0.150
  q7_preserved: true
  arbitrary_pose_ik_claimed: false

execution:
  interpolation: minimum_jerk
  reuse_nominal_home_and_safe_mid_segments: true
  reuse_nominal_hand_targets_and_durations: true
  execute_phases:
    - HOME
    - VISUAL_PREFLIGHT
    - PREGRASP
    - GRASP
    - LIFT
    - HOLD
  reuse_pick_finite_contact_torque_lift_slip_gates: true
  operational_torque_target_nm: 1.8
  hard_stop_nm: 2.0

output:
  directory: artifacts/kcg_connector/d38999_visual_xy_pick_probe_v1
  cpu_plan_filename: cpu_plan.json
  report_filename: report.json

boundaries:
  explicit_opt_in_required: true
  existing_e2e_modified: false
  existing_regrasp_modified: false
  robot_asset_modified: false
  frozen_baseline_modified: false
  truth_xy_used_for_target: false
  truth_xy_evaluation_only: true
  orientation_estimated_from_rgbd: false
  full_6d_claimed: false
  production_control_authorized: false
  collision_planned: false
  arbitrary_pose_reachability_claimed: false
  object_pose_writes_after_physics_allowed: false
  real_assembly_success_claimed: false
