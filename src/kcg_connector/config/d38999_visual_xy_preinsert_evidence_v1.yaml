# CPU-only, fail-closed evidence policy for four approved visual-XY
# pick-to-preinsert probes.  This file defines paths and semantics only; the
# companion source manifest binds every input by byte size and SHA-256.
schema_version: kcg_d38999_visual_xy_preinsert_evidence_config_v1
expected_run_count: 4
source_manifest_path: src/kcg_connector/config/d38999_visual_xy_preinsert_evidence_manifest_v1.json
shared_preinsert_config_path: src/kcg_connector/config/d38999_visual_xy_preinsert_probe_v1.yaml

policy:
  evidence_scope: independent_four_position_visual_xy_pick_to_preinsert_outside_entry_only
  require_all_runs_passed: true
  require_distinct_authored_loose_xy: true
  require_same_authored_fixed_xy: true
  engage_gate_blocking_run_id: plus10_xy
