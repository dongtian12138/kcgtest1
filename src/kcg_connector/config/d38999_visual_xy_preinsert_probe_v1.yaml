# Disabled-by-default CPU contract for the next same-World milestone.  It
# consumes the already proven visual-XY pick plan and prepares only the
# transport, axis-high and 12 mm preinsert targets.  It intentionally stops
# before the 10 mm entry datum because the current fixed-end XY observation is
# not accurate enough for the 0.20 mm insertion tolerance.
schema_version: kcg_d38999_visual_xy_preinsert_probe_v1
enabled_by_default: false
status: prepared_cpu_plan_not_physx_executed

inputs:
  visual_xy_adapter:
    path: src/kcg_connector/config/d38999_visual_xy_control_adapter_v1.yaml
    sha256: 748c4f5e2c07c678e8bbb395b3a3ef3d656dea035fbebe09ee66886545148431
  nominal_insertion:
    path: src/kcg_connector/config/d38999_physical_insertion_v1.yaml
    sha256: 652b46768735e59146fb249c8c7944ead9a68dc60837c615bc561361f7ded10d

planning:
  start_stage: VISUAL_XY_UNSUPPORTED_HOLD_PASSED
  target_order: [transport_safe, axis_high, preinsert]
  stop_stage: PREINSERT
  target_translation_source: visual_fixed_receptacle_xy
  target_z_source: registered_nominal
  target_orientation_source: registered_nominal_fk
  use_body_truth_for_target: false
  use_fixed_truth_for_target: false
  use_truth_for_iterative_correction: false
  interpolation: minimum_jerk

local_fixed_q7_ik:
  maximum_iterations: 50
  damping: 0.000001
  maximum_fk_position_error_m: 0.0000001
  maximum_fk_orientation_error_rad: 0.0000001
  maximum_abs_joint_delta_from_nominal_rad: 0.150
  q7_preserved_per_target: true
  maximum_planned_joint_speed_rad_s: 1.0

# The signed assembly contract places preinsert 2 mm above the entry datum.
# This is a registered-geometry margin, not measured collision clearance.
axial_scope:
  preinsert_gap_m: 0.012
  entry_gap_m: 0.010
  registered_margin_before_entry_m: 0.002
  engage_target_planned: false
  insertion_target_planned: false

runtime_failure_gates:
  require_prior_visual_pick_pass: true
  require_same_world_and_capture_id: true
  require_no_object_pose_writes_after_start: true
  require_no_robot_table_fixture_or_fixed_contact: true
  require_no_loose_fixed_contact_before_entry: true
  require_all_fingers_retain_body_contact: true
  require_finger_torque_below_hard_stop: true
  actual_body_fixed_alignment_truth_evaluation_only: true
  actual_alignment_must_not_change_targets: true

output:
  cpu_plan_filename: preinsert_cpu_plan.json

boundaries:
  explicit_opt_in_required: true
  existing_e2e_modified: false
  existing_visual_pick_default_modified: false
  frozen_baseline_modified: false
  truth_xy_used_for_target: false
  truth_pose_feedback_used_for_target: false
  orientation_estimated_from_rgbd: false
  full_6d_claimed: false
  engage_executed: false
  insertion_executed: false
  twist_executed: false
  home_return_executed: false
  collision_planned: false
  gpu_or_physx_validated: false
  production_control_authorized: false
  assembly_success_claimed: false
