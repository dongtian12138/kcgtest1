schema_version: kcg_d38999_wrist_multiview_v1
enabled: true
mode: WRIST_MULTIVIEW
camera_search_report: artifacts/kcg_connector/d38999_visual_ft_e2e_v1/wrist_camera_search_20260813T0730Z/camera_search.json
optimized_variable: T_receptacle_plug_at_final_preinsert
joint_optimization: true
per_view_pose_then_average: false
camera_extrinsic_optimized: false
views:
  - POST_GRASP_INSPECTION
  - MULTIVIEW_VIEW_1
  - MULTIVIEW_VIEW_2
  - FINAL_PREINSERT_VIEW
feature_roles:
  plug_mating: [mating_body_nose, guide_shell, c2_key_features]
  plug_occluder_only: [coupling_nut, rear_body]
  receptacle_mating: [entry_rim, entrance_chamfer, guide_bore]
  receptacle_occluder_only: [outer_shell, flange]
losses:
  - mating_rim_rgb_subpixel_edge
  - silhouette_distance_transform
  - visible_depth_point_to_plane
  - visible_normal
  - in_hand_kinematic_prior
  - z_buffer_occlusion
c2:
  retain_hypotheses: 2
  unique_yaw_only_if_observation_disambiguates: true
authorization:
  effective_length_m: 0.012
  requested_effective_error_formula: lateral_error - 3sigma_lateral - effective_length*tan(axis_error + 3sigma_axis)
  safe_gate_formula: lateral_error + 3sigma_lateral + effective_length*tan(axis_error + 3sigma_axis) <= conservative_Bcapture_radius
  require_same_synchronized_scene: true
  require_valid_timestamp: true
  require_wrist_ft_tare: true
  require_payload_compensation: true
boundaries:
  formal_inputs: [rgb, registered_depth, robot_joint_state, tcp_fk, calibrated_camera_to_assembly_tcp, wrist_ft]
  forbidden_control_inputs: [object_truth, physx_contact_normal, collider_identity, contact_point_truth, penetration_depth_truth]
  ideal_mask_depth_scope: offline_observability_diagnostic_only
  posthoc_sim_truth_scope: episode_end_evaluation_only
