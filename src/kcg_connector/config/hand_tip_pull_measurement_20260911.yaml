interpretation:
  - Use the actual test configuration and coupled finger Jacobian to map rope load to actuator effort.
  - Include gravity, transmission losses and dynamics appropriate to the measurement.
  - Normal load scalar sum, resultant contact force and joint moment are different quantities.
  - A 15 N directional tip test does not establish a universal 15 N contact-pressure limit.
  - This measurement alone neither authorizes nor calibrates a 30 N contact-force target.
  - Full-stroke success establishes lifted-load capability along that test trajectory; it does not identify all directional force maxima.
  - PWM600 of750 is an80percent command ratio, not a measured current limit or80percent rated torque.
