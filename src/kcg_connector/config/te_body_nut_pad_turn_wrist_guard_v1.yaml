    finite_closure_path_model_check: artifacts/kcg_connector/isaac/te_full_assembly_20260905/old_nailfree_pose_with_current_nails_geometry_v2.json
    prior_wrong_nonpad_contact_audit: artifacts/kcg_connector/isaac/te_full_assembly_20260905/thread_pilot_5tau_01/current_nut_grip_pad_surface_audit.json
    dynamic_pad_contact_verification_pending: true
  required_closing_joint_effort_nm:
