    - nailfree_hand_to_nut_transform
    - body_disturbance_torque_as_direct_nut_torque_capacity
    current_nail_geometry_and_grip_evidence: artifacts/kcg_connector/isaac/te_full_assembly_20260905/nut_regrasp_03/nut_regrasp_posthoc_v1.json
    current_validated_effort_references_retained_nm:
