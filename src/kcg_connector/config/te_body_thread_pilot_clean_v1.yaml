  blocked_hold_duration_s: 0.75
  unloaded_hold_duration_s: 0.25
  rotation_settle_duration_s: 0.5
  maximum_total_search_duration_s: 75.0
  transport_face_gap_m: 0.05
  maximum_precontact_speed_m_s: 0.002
  precontact_face_gap_m: 0.003
  target_key_entry_depth_m: 0.001
  maximum_axial_travel_m: 0.009
  axial_force_reference_n: 0.2
  maximum_axial_speed_m_s: 0.0003
  maximum_xy_correction_m: 0.002
  maximum_xy_speed_m_s: 0.00015
  maximum_tilt_correction_deg: 1.0
  maximum_tilt_speed_rad_s: 0.002
  sweep_start_deg: -10.0
  sweep_end_deg: 10.0
  sweep_speed_deg_s: 0.5
  maximum_contact_duration_s: 75.0
  maximum_transport_joint_speed_rad_s: 0.15
  contact_seating:
    enabled: true
    stability_duration_s: 0.5
    minimum_force_reference_fraction: 0.75
    maximum_force_reference_fraction: 1.5
    maximum_depth_range_m: 3.0e-05
    rationale: 0.20 N参考不变。承载状态使用50 ms一阶因果低通后的力，连续0.5 s在0.15–0.30 N且编码器深度变化≤30 um；原始力继续做保护和导纳。原逐原始样本判据在contact_seat_01因接触抖动漏判，回放25.3417
      s时可检出真实五键保持的稳定承载；新动作仍须实跑。
    travel_bound_rationale: 3 mm视觉前位加已观测约4.37 mm承载深度仍小于9 mm；保留约1.6 mm范围余量，最大到6 mm深度，远未到14.6
      mm密封端面。接触位置不是在线目标。
    force_state_filter_time_constant_s: 0.05
probe_stops:
  maximum_contact_axial_force_n: 0.75
  maximum_contact_lateral_force_n: 0.3
  maximum_contact_bending_moment_nm: 0.02
  maximum_contact_torsional_moment_nm: 0.015
  note: 这些是本次轻触实验额外的较低停止值，不替换或提高原有腕部与单指保护。
