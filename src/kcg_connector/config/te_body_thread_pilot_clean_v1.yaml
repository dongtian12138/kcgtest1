  baseline: artifacts/kcg_connector/isaac/te_full_assembly_20260905/nut_regrasp_03/nut_regrasp_posthoc_v1.json
  success_next: 从事后数据核对螺母随动、Body键槽约束、实际轴向推进及接触位置，再继续有限旋合。
  failure_next: 定位第一次力/几何/关节限制或螺纹不进给原因，不自动增力。
