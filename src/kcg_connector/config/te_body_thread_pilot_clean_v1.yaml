  user_instruction: 持续完成现有有指甲三指手和机械臂的Isaac Sim电连接器全流程装配与学术成果；依据合理性修改旧门限。
  simulation_only: true
  hardware_authorized: false
  grasp_transport_observation_authorized: true
  light_contact_key_entry_authorized: true
  locking_authorized: true
experiment:
  hypothesis: 补入标准尺寸的代表性内牙后，原带指甲Nut抓持能传递一次30度旋拧；轴向推进由真实牙面接触及0.20 N力导纳产生。
