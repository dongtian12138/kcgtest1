  cooked_hand_geometry: artifacts/kcg_connector/isaac/te_full_assembly_20260905/nut_regrasp_01/cooked_finger_inspection/geometry_only_manifest.json
  nailfree_grasp_reuse:
    source_relation: src/kcg_connector/config/te_transport_grasp_relation_q70_4p5_v1.yaml
    nominal_evaluation: artifacts/kcg_connector/isaac/te_j35_real_mass_0p020_layout_sweep_v1/layout_70/grasp_lift/evaluation.json
    reused:
    - 70_degree_palm_layout
    - rear_coupling_nut_outer_grip_region
    - parallel_contact_latch
    - finite_0p075rad_preload
    - measured_effort_maintenance
    - same_62p459669g_mass_and_0p45_friction_model
    not_transferred_as_validated:
    - nailfree_joint_angles
    - nailfree_hand_to_nut_transform
    - body_disturbance_torque_as_direct_nut_torque_capacity
    current_nail_geometry_and_grip_evidence: artifacts/kcg_connector/isaac/te_full_assembly_20260905/nut_regrasp_03/nut_regrasp_posthoc_v1.json
    current_validated_effort_references_retained_nm:
    - 0.489391244043
    - 0.43295468874875
    - 0.4078378054775
nut_rotation:
  enabled: true
  rotation_about_socket_plus_z_deg: -30.0
  rotation_direction_source: RIGHT_HAND_THREE_START_THREAD; clockwise viewed from
    plug rear advances toward socket
  maximum_rotation_speed_deg_s: 2.0
  axial_settle_duration_s: 2.0
  post_rotation_hold_s: 1.0
  axial_force_reference_n: 0.2
  axial_admittance_m_per_n_s: 0.0015
  maximum_axial_speed_m_s: 0.0003
  maximum_axial_travel_m: 0.004
  maximum_arm_speed_rad_s: 0.075
  payload_mass_kg: 0.062459669349
  payload_com_body_m:
  - 3.365477557677864e-06
  - 1.407639432650501e-06
  - -0.018135482890882567
  payload_source: original frozen source Body and CouplingNut MassAPI values; Nut
    transverse COM is essentially zero
  stops:
    axial_force_n: 0.75
    lateral_force_n: 0.75
    bending_moment_nm: 0.2
    torsional_moment_nm: 0.04
  stop_rationale: 单次低速旋拧的附加工程停止值；轴向沿用0.75 N。Nut抓持已观测0.393 N横向残力，不能套用自由导键的0.30 N判据；接触原点弯矩单独计算。0.04
    N·m为本次双倍0.020 N·m假设内阻的有界试验值，不代表厂商额定或旧试验认证。原3.0400615 N/1.380577 N·m腕部及0.9 N·m单指保护继续有效。
  no_lead_based_position_command: true
  no_loaded_wrench_rezeroing: true
