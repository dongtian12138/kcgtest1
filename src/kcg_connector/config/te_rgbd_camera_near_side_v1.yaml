# Frozen simulation-only near-side observation camera.  This is one view
# change after the fixed-global view returned MISS_KEY_NOT_OBSERVABLE; it does
# not change the TE poses, workspaces, segmentation, 4 px gate, or grasp.
schema_version: kcg_te_rgbd_camera_v1
camera:
  view_id: near_side_single_view_v1
  calibration_id: te_near_side_rgbd_sim_v1
  prim_path: /World/D38999TabletopV1/TeNearSideRgbdCamera
  frame_id: te_near_side_rgbd_camera_optical
  # 55 mm closer than the first FOV-feasible ray, along the same optical
  # line.  This gives both key-width bounds and the plug's 0.787 mm exposed
  # key band more than 10 percent margin above the frozen 4 px gate.
  eye_world_m: [0.6909924702601342, -0.3951701813111166, 0.30681475920915197]
  target_world_m: [0.500, -0.100, 0.220]
  resolution_px: [1280, 720]
  frequency_hz: 20
  warmup_frames: 5
  channels_exactly: [rgb, distance_to_image_plane]
  camera_cv_axes: [x_right, y_down, z_forward]
  focal_length_mm: 24.0
  horizontal_aperture_mm: 20.955
  clipping_range_m: [0.1, 10.0]

