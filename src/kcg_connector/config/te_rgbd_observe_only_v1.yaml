# One frozen, observation-only RGB-D scene for the current TE transport-grasp
# baseline.  The plug retains the historical Rx180 tabletop attitude; its
# mating face therefore points toward the table.  This configuration does not
# authorize a pose, a grasp, or any robot motion.  In particular, inability to
# see the unique wide main key must produce MISS_KEY_NOT_OBSERVABLE.
schema_version: kcg_te_rgbd_observe_only_v1
mode: SIMULATION_ONLY_TE_RGBD_OBSERVE_ONLY

authorization:
  simulation_only: true
  hardware_authorized: false
  robot_present: false
  robot_motion_authorized: false
  visual_control_authorized: false
  insertion_control_authorized: false

source_contracts:
  tabletop_config: src/kcg_connector/config/d38999_tabletop_scene_v1.yaml
  rgbd_config: src/kcg_connector/config/d38999_rgbd_bootstrap_v1.yaml
  te_contract: src/kcg_connector/config/te_j35_simulation_v1.yaml
  geometry_audit: artifacts/kcg_connector/isaac/te_j35_engineering_v1/STEP_GEOMETRY_AUDIT.json

experiment_contract:
  current_physical_state: DEVELOPMENT_TRANSPORT_GRASP_REOBSERVE_REQUIRED_NO_NEW_MOTION
  unique_unknown: fixed_global_ordinary_rgbd_evidence_rejects_unobservable_unique_plug_key
  single_frozen_variable: fixed_global_rgbd_v1_with_historical_transport_rx180_tabletop_v1
  falsifiable_judgment: endpoint_depth_is_present_but_optimistic_smallest_key_width_is_below_4px_so_formal_miss_and_zero_commands
  miss_branch: change_only_the_observation_view_before_any_motion
  ready_branch: proceed_only_to_full_te_cad_registration_without_motion

assets:
  plug:
    role: loose_plug
    model_id: te_deutsch_d38999_26fj35pn
    identity: D38999/26FJ35PN
    render_asset: artifacts/kcg_connector/isaac/te_j35_engineering_v1/visual/D38999_26FJ35PN_VISUAL.usdc
    render_asset_sha256: db4fd462fba59a347e0760e61499557452806ee4231d9cb5c8079218e557777b
    registration_cad: artifacts/kcg_connector/isaac/te_j35_engineering_v1/visual/D38999_26FJ35PN_VISUAL.stl
    registration_cad_sha256: 89bbf4ba3b8b5fb388276a378a820bb7547e676e97f0b9e2635b7862a86aa617
    pose_prim_path: /World/D38999TabletopV1/TEJ35ObserveOnly/LoosePlugPose
    reference_prim_path: /World/D38999TabletopV1/TEJ35ObserveOnly/LoosePlugPose/OfficialVisual
  receptacle:
    role: fixed_receptacle
    model_id: te_deutsch_d38999_20fj35sn
    identity: D38999/20FJ35SN
    render_asset: artifacts/kcg_connector/isaac/te_j35_engineering_v1/visual/D38999_20FJ35SN_VISUAL.usdc
    render_asset_sha256: c13587de80483d3be26dd53c2e625e2b9f98fd628fc87de5b446beb0a32ef117
    registration_cad: artifacts/kcg_connector/isaac/te_j35_engineering_v1/visual/D38999_20FJ35SN_VISUAL.stl
    registration_cad_sha256: 5a972c8c77fe75a619362380c604a969098e3338859c9e0a223f47afc25395e0
    pose_prim_path: /World/D38999TabletopV1/TEJ35ObserveOnly/FixedReceptaclePose
    reference_prim_path: /World/D38999TabletopV1/TEJ35ObserveOnly/FixedReceptaclePose/OfficialVisual

# These transforms are available only to the scene author.  They are omitted
# from provider_input.json, so the formal estimator cannot consume them.
scene_generation_truth:
  scene_pose_id: historical_transport_rx180_tabletop_v1
  plug_world_translation_m: [0.520, -0.210, 0.200]
  plug_world_rotation_xyz_deg: [180.0, 0.0, 0.0]
  plug_support_surface: table_top
  receptacle_world_translation_m: [0.550, 0.185, 0.271623]
  receptacle_world_rotation_xyz_deg: [0.0, 0.0, 0.0]
  receptacle_support_surface: fixture_top

observation_contract:
  view_id: fixed_global_rgbd_v1
  calibration_id: te_fixed_global_rgbd_sim_v1
  world_frame_id: world
  camera_frame_id: d38999_rgbd_camera_optical
  camera_eye_world_m: [0.550, -0.850, 0.720]
  camera_target_world_m: [0.535, -0.0125, 0.231]
  camera_cv_axes: [x_right, y_down, z_forward]
  resolution_px: [640, 480]
  channels_exactly: [rgb, distance_to_image_plane]
  focal_length_mm: 24.0
  horizontal_aperture_mm: 20.955
  clipping_range_m: [0.1, 10.0]
  plug_workspace_world_aabb_m:
    minimum: [0.470, -0.260, 0.198]
    maximum: [0.570, -0.160, 0.245]
  receptacle_workspace_world_aabb_m:
    minimum: [0.500, 0.135, 0.235]
    maximum: [0.600, 0.235, 0.285]
  minimum_endpoint_points: 150
  minimum_key_width_px: 4.0
  minimum_foreground_depth_delta_m: 0.00025
  capture_rt_subframes: 4

formal_gate:
  required_outputs:
    - plug_position_xyz_m
    - plug_quaternion_xyzw
    - plug_insertion_axis_world
    - plug_unique_main_key_world
    - receptacle_position_xyz_m
    - receptacle_quaternion_xyzw
    - receptacle_insertion_axis_world
    - receptacle_unique_main_keyway_world
  key_observation_required: true
  ambiguous_key_result: MISS_KEY_AMBIGUOUS
  unobserved_key_result: MISS_KEY_NOT_OBSERVABLE
  missing_endpoint_result: MISS_ENDPOINT_NOT_FOUND
  miss_authorizes_motion: false
  pose_result_from_scene_generation_truth_forbidden: true

truth_firewall:
  provider_inputs_exactly:
    - ordinary_rgb
    - ordinary_depth
    - ordinary_static_scene_depth
    - camera_intrinsics
    - frozen_world_from_camera_cv
    - te_registration_cad
    - known_static_table_and_fixture_geometry
    - frozen_endpoint_workspaces
  forbidden_provider_inputs:
    - semantic_segmentation_truth
    - instance_segmentation_truth
    - object_pose_truth
    - object_prim_path
    - renderer_truth_point_cloud
    - contact_truth
    - collider_identity
    - penetration_depth_truth
  posthoc_truth_evaluation_allowed: true

output:
  root_directory: artifacts/kcg_connector/isaac/te_visual_ft_assembly_v1/workflow_a/te_rgbd_observe_only_v1
  existing_output_policy: REFUSE_OVERWRITE
  capture_report_filename: capture_report.json
  provider_input_filename: provider_input.json
  observability_report_filename: observability_report.json
