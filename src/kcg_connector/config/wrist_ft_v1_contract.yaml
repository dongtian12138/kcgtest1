    runtime_joint_warning_count: 0
    traceback_count: 0

# A second estimate may be reconstructed from the seven iiwa joint torque
# sensors.  It is not treated as identical to a wrist sensor.
joint_torque_wrench_estimator:
  role: independent_redundant_estimate
  integration_enabled: false
  implementation_module: kcg_connector.joint_torque_wrench
  implementation_function: estimate_tool_wrench
  source_joint_names:
    - iiwa_joint_1
    - iiwa_joint_2
    - iiwa_joint_3
    - iiwa_joint_4
    - iiwa_joint_5
    - iiwa_joint_6
    - iiwa_joint_7
  external_torque_relation: "tau_ext = transpose(J_tool(q)) * wrench_tool"
  full_rank_solution: "wrench_tool = inverse(J*transpose(J)) * J * tau_ext"
  deployed_solver: weighted_damped_least_squares
  jacobian_shape: [6, 7]
  required_task_rank: 6
  nullspace_dimension_at_full_rank: 1
  monitor_nullspace_projection_residual: true
  condition_number_metric: "sqrt(W) * transpose(J) * diag(wrench_scales)"
  contact_distribution_observable: false
  arm_link_contact_localization_from_single_wrench: false
  assumptions:
    - only_one_external_contact_resultant_at_known_tool_frame
    - calibrated_joint_torque_sign_scale_and_bias
    - accurate_joint_state_time_alignment
    - compensated_robot_and_payload_dynamics
    - jacobian_not_singular_or_ill_conditioned
  compensation_terms:
    - gravity
    - payload_gravity
    - inertia
    - coriolis_and_centrifugal
    - joint_friction_and_hysteresis
    - sensor_bias_and_temperature_drift
    - cable_and_unmodeled_loads
  damping: null
  wrench_scales: null
  maximum_condition_number: null
  maximum_projection_residual_nm: null
  calibrated_covariance: null

fusion:
  primary_sim_source: hand2arm_reaction_wrench
  primary_real_source: physical_wrist_ft_when_available
  fallback_real_source: jacobian_joint_torque_estimate
  keep_three_finger_base_torques: true
  reject_or_degrade_near_singularity: true
  require_source_timestamp_and_health: true

residual_v1:
  interface_version: kcg_connector_twist_residual_wrist_ft_v1
  base_interface_version: kcg_connector_twist_residual_v0
  action_names:
    - tightening_speed_residual
    - f1j2_clamp_residual
    - f2j1_clamp_residual
    - f3j2_clamp_residual
  appended_observation_names:
    - wrist_force_x
    - wrist_force_y
    - wrist_force_z
    - wrist_torque_x
    - wrist_torque_y
    - wrist_torque_z
  action_size: 4
  observation_size: 30
  observation_source: compensated_connector_task_frame_wrench
  normalized_clip_range: [-1.0, 1.0]
  normalization_scales:
    lateral_force_n: null
    axial_force_n: null
    bending_torque_nm: null
    tightening_torque_nm: null

compensation:
  subtract_electronic_bias: true
  subtract_distal_tool_gravity: true
  subtract_grasped_payload_gravity: true
  compensate_dynamic_inertia: true
  use_current_robot_orientation: true
  use_current_finger_configuration: true
  use_estimated_hand_to_connector_transform: true
  electronic_bias_update_allowed_phases:
    - HOME_FREE_SPACE_EMPTY_HAND
  payload_capture_allowed_phases:
    - POST_GRASP_FREE_SPACE
  tare_forbidden_phases:
    - INSERT
    - ENGAGE
    - SCREW
    - HOLD

# Operational limits remain deliberately unset. Enabling the v1 consumer
# while any required value is null must be rejected by the future loader.
safety_limits:
  maximum_raw_force_n: null
  maximum_raw_torque_nm: null
  maximum_lateral_force_n: null
  maximum_axial_force_n: null
  maximum_bending_torque_nm: null
  maximum_tightening_torque_nm: null
  stale_timeout_s: null

success_requires_all:
  - measured_nut_progress
  - measured_axial_progress
  - connector_depth_or_gap_in_tolerance
  - tightening_torque_in_terminal_band
  - lateral_force_and_bending_in_tolerance
  - finger_base_torques_loaded_and_stable
  - stable_hold

failure_evidence:
  early_jam:
    - tightening_torque_high_before_target_progress
    - axial_progress_stalled
  lateral_jam:
    - lateral_force_or_bending_high
    - axial_progress_stalled
  grasp_slip:
    - finger_base_torque_imbalance_or_drop
    - hand_to_connector_pose_changed
  estimator_invalid:
    - jacobian_rank_below_six
    - jacobian_condition_limit_exceeded
    - joint_torque_projection_residual_high
  sensor_fault:
    - nonfinite_wrench
    - stale_timestamp
    - saturation_or_overload

required_before_enable:
  - six_axis_sign_and_frame_unit_load_tests
  - calibrated_tool_and_payload_compensation
  - per_connector_normalization_scales
  - per_connector_soft_and_hard_safety_limits
  - timestamp_latency_and_filter_validation
  - jacobian_rank_condition_and_projection_residual_monitor
  - joint_torque_estimator_calibration_if_used_on_hardware
  - unchanged_v0_physics_regression
