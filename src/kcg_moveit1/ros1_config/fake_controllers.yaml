controller_list:
  - name: fake_kuka_controller
    type: $(arg fake_execution_type)
    joints:
      - iiwa_joint_1
      - iiwa_joint_2
      - iiwa_joint_3
      - iiwa_joint_4
      - iiwa_joint_5
      - iiwa_joint_6
      - iiwa_joint_7
  - name: fake_hand_controller
    type: $(arg fake_execution_type)
    joints:
      - f1j1
      - f1j2
      - f2j1
      - f3j2
initial:  # Define initial robot poses per group
  - group: kuka
    pose: zerokuka
  - group: hand
    pose: zerohand