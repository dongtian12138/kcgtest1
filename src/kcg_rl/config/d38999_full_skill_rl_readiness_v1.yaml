# Long full-skill training is deliberately disabled until every evidence gate
# below has a current, independently hashed PASS document.  The existing
# already-engaged residual-v0 runner does not read this file.
schema_version: kcg_d38999_full_skill_rl_readiness_v1

training:
  enabled: false
  full_skill_interface_version: kcg_d38999_full_skill_hierarchical_v1
  residual_interface_version: kcg_connector_twist_residual_wrist_ft_v1
  base_residual_interface_version: kcg_connector_twist_residual_v0
  action_size: 4
  observation_size: 30
  active_v0_modified: false
  long_training_requires_readiness_pass: true

# The deterministic stage machine owns vision, grasping and free-space motion.
# The present 4D policy has no Cartesian action, so it may only influence the
# already aligned contact skill.  This prevents an unobservable policy from
# being advertised as an end-to-end visual manipulation policy.
workflow:
  topology: hierarchical_fsm_with_contact_residual
  stage_order:
    - DETECT_LOOSE
    - PICK
    - IN_HAND_RELOCALIZE
    - DETECT_FIXED
    - PREALIGN
    - INSERT
    - ENGAGE
    - SCREW
    - VERIFY
    - RETREAT
    - HOME
  policy_active_stages: [ENGAGE, SCREW]
  fsm_owns_perception_pick_and_free_space_motion: true
  perception_control_source: measured_rgbd_pose
  simulation_ground_truth_control_authority: false

# These records preserve useful completed work without promoting it into a
# full-skill gate PASS.  The checker re-hashes every file and runs the named
# artifact-specific schema validator.  Scope and limitations are emitted in
