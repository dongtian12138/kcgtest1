      tested_pose_pairs: {minimum: 100}
      detection_success_rate: {minimum: 0.99}
      loose_translation_error_max_mm: {maximum: 2.0}
      fixed_translation_error_max_mm: {maximum: 2.0}
      pose_control_truth_reads: {equal: 0}
